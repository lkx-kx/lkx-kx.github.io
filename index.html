// WORK CHECKIN - CALENDAR
// ====================================================================
// 2026 法定节假日（放假区间）与调休补班日 —— 以国务院办公厅《关于2026年部分节假日安排的通知》(国办发明电〔2025〕7号) 为准
// 放假区间（含调休）：元旦1/1-1/3、春节2/15-2/23、清明4/4-4/6、劳动节5/1-5/5、端午6/19-6/21、中秋9/25-9/27、国庆10/1-10/7
const HOLIDAY_RANGES_2026 = [
  ['2026-01-01', '2026-01-03'], // 元旦（1/1-1/3 放假，共3天）
  ['2026-02-15', '2026-02-23'], // 春节（2/15-2/23 放假，共9天）
  ['2026-04-04', '2026-04-06'], // 清明
  ['2026-05-01', '2026-05-05'], // 劳动节
  ['2026-06-19', '2026-06-21'], // 端午
  ['2026-09-25', '2026-09-27'], // 中秋
  ['2026-10-01', '2026-10-07'], // 国庆
];
// 调休补班日（原本周末/节假日，但国家安排上班）
const MAKEUP_DAYS_2026 = [
  '2026-01-04', // 元旦调休（周日上班）
  '2026-02-14', // 春节调休（周六上班）
  '2026-02-28', // 春节调休（周六上班）
  '2026-05-09', // 劳动节调休（周六上班）
  '2026-09-20', // 国庆调休（周日上班）
  '2026-10-10', // 国庆调休（周六上班）
];
let _holidaySet = null;
function holidaySet() {
  if (_holidaySet) return _holidaySet;
  _holidaySet = new Set();
  HOLIDAY_RANGES_2026.forEach(([s, e]) => {
    let cur = new Date(s + 'T00:00:00');
    const end = new Date(e + 'T00:00:00');
    while (cur <= end) {
      _holidaySet.add(cur.getFullYear() + '-' + String(cur.getMonth() + 1).padStart(2, '0') + '-' + String(cur.getDate()).padStart(2, '0'));
      cur.setDate(cur.getDate() + 1);
    }
  });
  return _holidaySet;
}
let _makeupSet = null;
function makeupSet() {
  if (_makeupSet) return _makeupSet;
  _makeupSet = new Set(MAKEUP_DAYS_2026);
  return _makeupSet;
}
// y/m/d 中 m 为 0 基（与日历一致）；周六日或法定节假日视为休息日
function isRestDay(y, m, d) {
  const key = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  if (makeupSet().has(key)) return false; // 调休补班日：上班，不算休息
  const dt = new Date(y, m, d);
  const dow = dt.getDay();
  if (dow === 0 || dow === 6) return true;
  return holidaySet().has(key);
}

// 返回某天类型：'holiday'（法定节假日休）/ 'weekend'（周末休）/ 'makeup'（调休补班上班）/ 'work'（工作日）
function getDayKind(y, m, d) {
  const dt = new Date(y, m, d);
  const dow = dt.getDay();
  const key = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  if (makeupSet().has(key)) return 'makeup'; // 调休补班日：视为上班
  if (holidaySet().has(key)) return 'holiday';
  if (dow === 0 || dow === 6) return 'weekend';
  return 'work';
}

let calYear, calMonth;
let modalLeaveType = 'checkin';

// 日程：重复 / 全天 辅助
function schedOccursOn(s, date) {
  if (!s.repeat || s.repeat === 'none') return s.date === date;
  const base = new Date(s.date + 'T00:00:00');
  const cur = new Date(date + 'T00:00:00');
  if (isNaN(base.getTime()) || cur < base) return false;
  const diff = Math.round((cur - base) / 86400000);
  switch (s.repeat) {
    case 'daily': return true;
    case 'weekly': return diff % 7 === 0;
    case 'monthly': return base.getDate() === cur.getDate();
    case 'quarterly': {
      const mi = cur.getFullYear() * 12 + cur.getMonth() - (base.getFullYear() * 12 + base.getMonth());
      return mi >= 0 && mi % 3 === 0 && base.getDate() === cur.getDate();
    }
    case 'yearly': return base.getMonth() === cur.getMonth() && base.getDate() === cur.getDate();
    case 'weekday': { const w = cur.getDay(); return w !== 0 && w !== 6; }
  }
  return false;
}
function schedDoneOn(s, date) {
  if (s.repeat && s.repeat !== 'none') return Array.isArray(s.doneDates) && s.doneDates.includes(date);
  return !!s.done;
}
function setSchedDoneOn(s, date, val) {
  if (s.repeat && s.repeat !== 'none') {
    s.doneDates = Array.isArray(s.doneDates) ? s.doneDates : [];
    if (val) { if (!s.doneDates.includes(date)) s.doneDates.push(date); }
    else s.doneDates = s.doneDates.filter(d => d !== date);
  } else {
    s.done = val;
  }
}
function repeatLabel(r) {
  return { none: '不重复', daily: '每天', weekly: '每周', monthly: '每月', quarterly: '每三个月', yearly: '每年', weekday: '工作日' }[r] || '不重复';
}

// 聚合某天的日程：待办（带 date）+ 每日任务（按当天数据）+ 重复日程
function getDaySchedule(year, month, dayStr) {
  const dayKey = year + '-' + String(month + 1).padStart(2, '0') + '-' + dayStr;
  const sched = [];
  Store.getTodos().forEach(t => {
    if (t.date && t.date === dayKey) sched.push({ kind: 'todo', time: t.time || '', text: t.text, done: t.done });
  });
  Store.getSchedule().forEach(s => {
    if (schedOccursOn(s, dayKey)) sched.push({ kind: 'sched', time: s.allday ? '' : (s.time || ''), text: s.title, done: schedDoneOn(s, dayKey) });
  });
  const d = Store.getDaily(dayKey);
  (d.tasks || []).forEach(t => sched.push({ kind: 'task', time: '', text: t.text, done: t.done }));
  sched.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  return sched;
}

function truncText(s, n) {
  s = String(s || '');
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function schedPills(sched) {
  const max = 2;
  const shown = sched.slice(0, max);
  let html = shown.map(s =>
    `<span class="cal-pill ${s.kind}${s.done ? ' done' : ''}"><span class="ov-dot ${s.done ? 'on' : ''}"></span>${s.time ? escHtml(s.time) + ' ' : ''}${escHtml(truncText(s.text, 8))}</span>`
  ).join('');
  if (sched.length > max) html += `<span class="cal-pill more">+${sched.length - max} 条</span>`;
  return html;
}

function nextMonth() {

function goToday() {

function getWorkDefaults() {

    const raw = localStorage.getItem('lxk_work_defaults');
    if (raw) { const o = JSON.parse(raw); return { start: o.start || '09:00', end: o.end || '18:00' }; }
  } catch (e) {}
  return { start: '09:00', end: '18:00' };
}
function nowHM() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function todayPunchKey() {
  const d = new Date();
  return {
    monthKey: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'),
    dayStr: String(d.getDate()).padStart(2, '0')
  };
}
function leaveStatusText(rec) {

    case 'sick':   return '<span style="color:#C68888;font-size:16px;">🤒 今日病假</span>';

    default: return '';
  }
}
// 写入/更新今日打卡记录（上班 / 下班），并同步 daily 与累计数据
function writeCheckinRecord(opts) {
  const t = todayPunchKey();
  const att = Store.getAttendance(t.monthKey);
  const prev = att[t.dayStr] || {};
  const wasCheckin = prev.type === 'checkin';
  const rec = { type: 'checkin' };
  rec.checkin = (opts.checkin !== undefined) ? opts.checkin : (prev.checkin || null);
  rec.checkout = (opts.checkout !== undefined) ? opts.checkout : (prev.checkout || null);
  att[t.dayStr] = rec;
  Store.setAttendance(t.monthKey, att);
  const data = Store.getDaily();
  data.workCheckin = rec.checkin || null;
  data.workCheckout = rec.checkout || null;
  Store.saveDaily(data);
  // 累计只在上班（首次转为 checkin）时 +1，下班不重复计数
  const cum = Store.getCumulative();
  const today = Store.todayKey();
  if (!wasCheckin) {
    if (cum.lastCheckinDate !== today) {
      const y = new Date(); y.setDate(y.getDate() - 1);
      const yKey = y.getFullYear() + '-' + String(y.getMonth()+1).padStart(2,'0') + '-' + String(y.getDate()).padStart(2,'0');
      cum.streak = (cum.lastCheckinDate === yKey) ? cum.streak + 1 : 1;
      cum.lastCheckinDate = today;
    } else if (cum.streak === 0) { cum.streak = 1; }
    cum.totalCheckins += 1;
    Store.saveCumulative(cum);
  }
  renderPage('work-checkin');
}

function quickCheckin() {

  const def = getWorkDefaults();
  writeCheckinRecord({ checkin: def.start });
  showToast('已打上班卡 ' + def.start + ' ⏰');

function quickCheckout() {
  const t = todayPunchKey();
  const att = Store.getAttendance(t.monthKey);

function saveAttendance(dayStr) {
  const monthKey = calYear + '-' + String(calMonth + 1).padStart(2, '0');
  const att = Store.getAttendance(monthKey);
  const wasCheckin = att[dayStr] && att[dayStr].type === 'checkin';
  const wasDuty = att[dayStr] && att[dayStr].type === 'duty';

  att[dayStr] = { type: modalLeaveType };
  if (modalLeaveType === 'checkin' || modalLeaveType === 'duty' || modalLeaveType === 'makeup') {
    att[dayStr].checkin = document.getElementById('modal-checkin').value || '09:00';
    const checkoutVal = document.getElementById('modal-checkout').value;
    if (checkoutVal) att[dayStr].checkout = checkoutVal;
  }
  Store.setAttendance(monthKey, att);

  // 值班打卡：自动增加调休总额 1 天；从值班改为其它类型则扣回
  if (modalLeaveType === 'duty' && !wasDuty) {
    const ls = Store.getLeaveSettings();
    ls.compTotal = (ls.compTotal || 0) + 1;
    Store.saveLeaveSettings(ls);
  } else if (wasDuty && modalLeaveType !== 'duty') {
    const ls = Store.getLeaveSettings();
    ls.compTotal = Math.max(0, (ls.compTotal || 0) - 1);
    Store.saveLeaveSettings(ls);
  }

  // If it's today, sync daily data and cumulative
  const now = new Date();
  const isToday = calYear === now.getFullYear() && calMonth === now.getMonth() && parseInt(dayStr) === now.getDate();
  if (isToday && modalLeaveType === 'checkin') {
    const data = Store.getDaily();
    data.workCheckin = att[dayStr].checkin;
    data.workCheckout = att[dayStr].checkout || null;
    Store.saveDaily(data);
    if (!wasCheckin) {
      const cum = Store.getCumulative();
      const today = Store.todayKey();
      if (cum.lastCheckinDate !== today) {
        const y = new Date(); y.setDate(y.getDate() - 1);
        const yKey = y.getFullYear() + '-' + String(y.getMonth()+1).padStart(2,'0') + '-' + String(y.getDate()).padStart(2,'0');
        cum.streak = (cum.lastCheckinDate === yKey) ? cum.streak + 1 : 1;
        cum.lastCheckinDate = today;
      } else if (cum.streak === 0) { cum.streak = 1; }
      cum.totalCheckins += 1;
      Store.saveCumulative(cum);
    }
  } else if (isToday && wasCheckin && modalLeaveType !== 'checkin') {
    // Changed from checkin to leave today - decrement cumulative
    const cum = Store.getCumulative();
    cum.totalCheckins = Math.max(0, cum.totalCheckins - 1);
    Store.saveCumulative(cum);
    const data = Store.getDaily();
    data.workCheckin = null;
    data.workCheckout = null;
    Store.saveDaily(data);
  }

  closeModal();
  showToast('记录已保存！');
  renderPage('work-checkin');
}

function clearAttendance(dayStr) {
  const monthKey = calYear + '-' + String(calMonth + 1).padStart(2, '0');
  const att = Store.getAttendance(monthKey);
  const wasCheckin = att[dayStr] && att[dayStr].type === 'checkin';

  delete att[dayStr];
  Store.setAttendance(monthKey, att);

  if (wasDuty) {
    const ls = Store.getLeaveSettings();
    ls.compTotal = Math.max(0, (ls.compTotal || 0) - 1);

  const now = new Date();
  const isToday = calYear === now.getFullYear() && calMonth === now.getMonth() && parseInt(dayStr) === now.getDate();
  if (isToday && wasCheckin) {
    const cum = Store.getCumulative();
    cum.totalCheckins = Math.max(0, cum.totalCheckins - 1);
    Store.saveCumulative(cum);
    const data = Store.getDaily();
    data.workCheckin = null;
    data.workCheckout = null;
    Store.saveDaily(data);

  closeModal();

}

// ====================================================================
// DAILY TASKS
// ====================================================================
// 把之前日期未完成的每日任务，顺延（自动同步）到今天
function rollForwardUnfinishedTasks() {
  const today = Store.todayKey();
  const records = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('lxk_daily_')) {
      const dk = k.replace('lxk_daily_', '');
      if (dk < today) {
        try { records[dk] = JSON.parse(localStorage.getItem(k)); } catch (e) {}
      }
    }
  }
  const days = Object.keys(records).sort();
  if (days.length === 0) { cleanTodayGhosts(today); return; }
  let carry = [];
  const carryIds = new Set();
  const carryTexts = new Set();
  // 所有过去日期中「已完成/已归档」的任务（用于剔除旧日未完成的重复副本）
  const resolvedIds = new Set();
  const resolvedTexts = new Set();
  for (const d of days) {
    const tasks = (records[d].tasks) || [];
    // 跨天后，把前一天已完成的每日任务归档进历史（仅归档一次）
    let needSave = false;
    tasks.forEach(t => {
      if (t.done && !t.archived) {
        Store.archiveTask({ id: t.id, text: t.text, doneDate: d, doneTime: t.doneTime || '', source: 'daily', rolled: !!t.rolled, icon: '📋' });
        t.archived = true;
        needSave = true;
      }
      if (t.done || t.archived) { resolvedIds.add(t.id); resolvedTexts.add(t.text); }
    });
    if (needSave) Store.setDaily(d, records[d]);
    // 本日若已完成的任务，从待顺延队列中移除（避免旧日未完成的副本被重复顺延）
    carry = carry.filter(t => !resolvedIds.has(t.id) && !resolvedTexts.has(t.text));
    // 本日未完成的任务加入待顺延队列（已完成的任务不再顺延）
    tasks
      .filter(t => !t.done && !t.archived && !resolvedIds.has(t.id) && !resolvedTexts.has(t.text))
      .forEach(t => {
        if (carryIds.has(t.id) || carryTexts.has(t.text)) return;
        carry.push({ id: t.id, text: t.text });
        carryIds.add(t.id); carryTexts.add(t.text);
      });
  }
  if (carry.length > 0) {
    const todayRec = Store.getDaily(today);
    if (!todayRec.tasks) todayRec.tasks = [];
    const tIds = new Set(todayRec.tasks.map(t => t.id));
    const tTexts = new Set(todayRec.tasks.map(t => t.text));
    let added = 0;
    carry.forEach(t => {
      if (tIds.has(t.id) || tTexts.has(t.text)) return;
      todayRec.tasks.push({ id: t.id, text: t.text, done: false, rolled: true });
      tIds.add(t.id); tTexts.add(t.text);
      added++;
    });
    if (added > 0) Store.setDaily(today, todayRec);
  }
  cleanTodayGhosts(today);
}

// 清理今天记录中「顺延且未完成」、但其 id/文本已在某过去日期完成归档的任务（旧顺延逻辑遗留的幽灵数据）
function cleanTodayGhosts(today) {
  const rec = Store.getDaily(today);
  if (!rec.tasks || !rec.tasks.length) return;
  const archivedIds = new Set();
  const archivedTexts = new Set();
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('lxk_daily_')) {
      const dk = k.replace('lxk_daily_', '');
      if (dk < today) {
        try {
          const tasks = (JSON.parse(localStorage.getItem(k)) || {}).tasks || [];
          tasks.forEach(t => { if (t.done || t.archived) { archivedIds.add(t.id); archivedTexts.add(t.text); } });
        } catch (e) {}
      }
    }
  }
  if (archivedIds.size === 0 && archivedTexts.size === 0) return;
  const before = rec.tasks.length;
  rec.tasks = rec.tasks.filter(t => !(t.rolled && (archivedIds.has(t.id) || archivedTexts.has(t.text))));
  if (rec.tasks.length !== before) Store.setDaily(today, rec);
}

function renderDailyTasks(container) {
  rollForwardUnfinishedTasks();
  const data = Store.getDaily();
  const doneCount = data.tasks.filter(t => t.done).length;
  const totalCount = data.tasks.length;
  const progress = totalCount > 0 ? Math.round(doneCount / totalCount * 100) : 0;

  // 自动汇入：待办事项中 date == 今天的条目
  const todayKey = Store.todayKey();
  // 已完成归档的待办事项不再在每日任务页显示
  const linkedTodos = Store.getTodos()
    .filter(t => t.date === todayKey && !t.done)
    .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

  // 自动汇入：日程中今天有发生的条目（含重复；已完成的当天不显示）
  const linkedSched = Store.getSchedule()
    .filter(s => schedOccursOn(s, todayKey) && !schedDoneOn(s, todayKey))
    .sort((a, b) => ((a.allday ? '00:00' : a.time || '99:99')).localeCompare(b.allday ? '00:00' : b.time || '99:99'));

  // 每日任务显示当天创建的全部任务（含已完成的，保留到零点再归档进历史）
  const activeTasks = data.tasks;

  container.innerHTML = `
    <div class="page-header">
      <span class="ph-icon">${DOG_ICONS['daily-tasks']}</span>
      <span class="ph-title">每日任务</span>
      <span class="ph-desc">每天清零，重新出发</span>
    </div>
    <div class="card">
      <div style="display:flex;gap:10px;margin-bottom:16px;">
        <input type="text" class="input" id="task-input" placeholder="输入任务，回车添加..." onkeypress="if(event.key==='Enter')addTask()">
        <button class="btn btn-primary" onclick="addTask()">添加</button>
      </div>
      ${totalCount > 0 ? `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:13px;color:var(--text-sub);">完成进度</span>
          <span style="font-size:13px;font-weight:600;color:var(--accent-caramel);">${doneCount}/${totalCount} (${progress}%)</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        ${doneCount === totalCount ? `<div style="margin-top:6px;font-size:12px;color:var(--accent-green);text-align:center;">🎉 今天的任务都完成啦，明天重新出发～</div>` : ''}
      ` : ''}
      <div id="task-list">
        ${activeTasks.length === 0 && linkedTodos.length === 0 && linkedSched.length === 0 ? `
          <div class="empty-state">
            <div class="es-icon">${totalCount > 0 ? '🎉' : '📝'}</div>
            <div>${totalCount > 0 ? '今天的任务都完成啦，明天重新出发～' : '还没有任务，添加一个开始吧～'}</div>
          </div>
        ` : `
          ${activeTasks.map(t => `
          <div class="task-item">
            <div class="task-checkbox ${t.done ? 'done' : ''}" onclick="toggleTask('${t.id}')"></div>
            <span class="task-text ${t.done ? 'done' : ''}">${escHtml(t.text)}</span>
            ${t.rolled ? '<span class="roll-badge" title="前一天未完成，已顺延到今天">↪ 顺延</span>' : ''}
            <button class="task-edit" onclick="editTask('${t.id}')" title="编辑">✎</button>
            <button class="task-delete" onclick="deleteTask('${t.id}')">✕</button>
          </div>
          `).join('')}
          ${linkedTodos.length ? `
            <div class="derived-label">📅 待办事项（按日期自动汇入 · ${todayKey}）</div>
            ${linkedTodos.map(t => `
              <div class="task-item todo-derived">
                <div class="task-checkbox ${t.done ? 'done' : ''}" onclick="toggleTodoDone('${t.id}')"></div>
                <span class="task-text ${t.done ? 'done' : ''}">${escHtml(t.text)}</span>
                ${t.time ? `<span class="task-time">${escHtml(t.time)}</span>` : ''}
                <span class="link-badge" title="来自待办事项（按日期自动汇入）">📅</span>
                <button class="task-edit" onclick="editTodo('${t.id}')" title="编辑待办">✎</button>
              </div>
            `).join('')}
          ` : ''}
          ${linkedSched.length ? `
            <div class="derived-label">📆 日程（按时间自动汇入 · ${todayKey}）</div>
            ${linkedSched.map(s => {
              const sd = schedDoneOn(s, todayKey);
              return `
              <div class="task-item todo-derived">
                <div class="task-checkbox ${sd ? 'done' : ''}" onclick="toggleScheduleDone('${s.id}','${todayKey}')"></div>
                <span class="task-text ${sd ? 'done' : ''}">${escHtml(s.title)}</span>
                ${s.allday ? `<span class="task-time">🌞 全天</span>` : (s.time ? `<span class="task-time">${escHtml(s.time)}</span>` : '')}
                ${s.repeat && s.repeat !== 'none' ? `<span class="sched-repeat-badge">🔁 ${repeatLabel(s.repeat)}</span>` : ''}
                <span class="link-badge" title="来自日程（按时间自动汇入）">📆</span>
                <button class="task-edit" onclick="editScheduleItem('${s.id}')" title="编辑日程">✎</button>
              </div>`;
            }).join('')}
          ` : ''}
        `}
      </div>
    </div>
  `;
}

function addTask() {
  const input = document.getElementById('task-input');
  const text = input.value.trim();
  if (!text) return;
  const data = Store.getDaily();
  data.tasks.push({ id: uid(), text, done: false });
  Store.saveDaily(data);
  renderPage('daily-tasks');
}

function toggleTask(id) {
  const data = Store.getDaily();
  const task = data.tasks.find(t => t.id === id);
  if (task) {
    const wasDone = task.done;
    task.done = !task.done;
    if (task.done) task.doneTime = nowHMS();
    Store.saveDaily(data);
    const cum = Store.getCumulative();
    if (task.done && !wasDone) {
      cum.totalTasksDone += 1;
      // 完成的每日任务保留到当天零点，跨天后由 rollForwardUnfinishedTasks 归档进历史
    } else if (!task.done && wasDone) {
      cum.totalTasksDone = Math.max(0, cum.totalTasksDone - 1);
    }
    Store.saveCumulative(cum);
    renderPage('daily-tasks');
  }
}

function deleteTask(id) {
  const data = Store.getDaily();
  data.tasks = data.tasks.filter(t => t.id !== id);
  Store.saveDaily(data);
  renderPage('daily-tasks');
}

function editTask(id) {
  const data = Store.getDaily();
  const task = data.tasks.find(t => t.id === id);
  if (!task) return;
  showModal(`
    <div class="modal-title">✎ 编辑任务</div>
    <div class="form-group">
      <label>任务内容</label>
      <input type="text" class="input" id="edit-task-text" value="${escAttr(task.text)}" placeholder="任务内容...">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTaskEdit('${id}')">保存</button>
    </div>
  `);
  setTimeout(() => { const el = document.getElementById('edit-task-text'); if (el) { el.focus(); el.select(); } }, 50);
}

function saveTaskEdit(id) {
  const data = Store.getDaily();
  const task = data.tasks.find(t => t.id === id);
  const text = document.getElementById('edit-task-text').value.trim();
  if (task && text) {
    task.text = text;
    Store.saveDaily(data);
  }
  closeModal();
  renderPage('daily-tasks');
}

function renderTodo(container) {
  const todos = Store.getTodos();
  const activeTodos = todos.filter(t => !t.done); // 已完成归档的待办不在列表中显示
  const cats = Store.getTodoCategories();
  const groups = {};
  cats.forEach(c => groups[c] = []);
  activeTodos.forEach(t => { if (!groups[t.category]) groups[t.category] = []; groups[t.category].push(t); });
  const total = todos.length;
  const done = todos.filter(t => t.done).length;
  const linked = activeTodos.filter(t => t.date === Store.todayKey()).length;

  let groupsHtml = '';
  if (total === 0) {
    groupsHtml = `<div class="empty-state"><div class="es-icon">📝</div><div>还没有待办事项，添加一条开始吧～</div></div>`;
  } else {
    groupsHtml = Object.keys(groups).map(cat => {
      if (groups[cat].length === 0) return '';
      const items = groups[cat].map(t => `
        <div class="todo-item ${t.done ? 'done' : ''}">
          <div class="todo-main">
            <div class="todo-text ${t.done ? 'done' : ''}">${escHtml(t.text)}</div>
            <div class="todo-meta">
              <span class="todo-cat">${escHtml(cat)}</span>
              ${t.date ? `<span style="font-size:11px;color:var(--accent-blue);cursor:pointer;" onclick="editTodoDate('${t.id}')" title="点击改期">📅 ${escHtml(t.date)}${t.time ? ' ' + escHtml(t.time) : ''}</span>` : `<span style="font-size:11px;color:var(--text-light);cursor:pointer;" onclick="editTodoDate('${t.id}')" title="设定日期">📅 设日期</span>`}
              ${t.date === Store.todayKey() ? '<span style="font-size:11px;color:var(--accent-green);">今日自动汇入每日任务</span>' : ''}
            </div>
          </div>
          <div class="todo-done ${t.done ? 'on' : ''}" onclick="toggleTodoDone('${t.id}')" title="标记完成">${t.done ? '✓' : ''}</div>
          <button class="task-edit" onclick="editTodo('${t.id}')" title="编辑">✎</button>
          <button class="task-delete" onclick="deleteTodo('${t.id}')">✕</button>
        </div>
      `).join('');
      return `
        <div class="todo-group">
          <div class="todo-group-title">${escHtml(cat)} <span style="opacity:.6;font-weight:400;">(${groups[cat].length})</span></div>
          ${items}
        </div>`;
    }).join('');
  }

  // 日程列表（按日期 + 时间排序）
  const sched = Store.getSchedule().slice().sort((a, b) =>
    (a.date + ' ' + (a.time || '99:99')).localeCompare(b.date + ' ' + (b.time || '99:99'))
  );
  let schedHtml;
  if (sched.length === 0) {
    schedHtml = `<div class="empty-state"><div class="es-icon">📆</div><div>还没有日程，添加一条开始吧～</div></div>`;
  } else {
    schedHtml = sched.map(s => {
      const sd = schedDoneOn(s, Store.todayKey());
      const occursToday = schedOccursOn(s, Store.todayKey());
      return `
      <div class="sched-item ${sd ? 'done' : ''}">
        <div class="sched-check ${sd ? 'on' : ''}" onclick="toggleScheduleDone('${s.id}')" title="标记完成">${sd ? '✓' : ''}</div>
        <div class="sched-body">
          <div class="sched-title ${sd ? 'done' : ''}">${escHtml(s.title)}</div>
          <div class="sched-meta">
            <span class="sched-date">📅 ${escHtml(s.date)}${s.allday ? ' 🌞全天' : (s.time ? ' ' + escHtml(s.time) : '')}</span>
            ${s.repeat && s.repeat !== 'none' ? `<span class="sched-repeat-badge">🔁 ${repeatLabel(s.repeat)}</span>` : ''}
            ${occursToday ? '<span class="sched-today">今日同步到每日任务</span>' : ''}
          </div>
          ${s.note ? `<div class="sched-note">${escHtml(s.note)}</div>` : ''}
        </div>
        <button class="task-edit" onclick="editScheduleItem('${s.id}')" title="编辑">✎</button>
        <button class="task-delete" onclick="deleteScheduleItem('${s.id}')">✕</button>
      </div>`;
    }).join('');
  }

  container.innerHTML = `
    <div class="page-header">
      <span class="ph-icon">${DOG_ICONS['todo']}</span>
      <span class="ph-title">待办事项</span>
      <span class="ph-desc">左侧清单 · 右侧日程（按时间同步到日历与每日任务）</span>
    </div>
    <div class="todo-columns">
      <div class="todo-col">
        <div class="card">
          <div style="display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;">
            <input type="text" class="input" id="todo-input" placeholder="添加待办..." style="flex:1;min-width:160px;" onkeypress="if(event.key==='Enter')addTodoItem()">
            <select class="input" id="todo-cat" style="width:auto;">${cats.map(c=>`<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('')}</select>
            ${datePickerHtml('todo-date', '', '选择日期')}
            ${timePickerHtml('todo-time', '', '选择时间')}
            <button class="btn btn-primary" onclick="addTodoItem()">添加</button>
            <button class="btn btn-outline" onclick="showAddCatModal()">＋分类</button>
          </div>
          <div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;">
            进行中 ${activeTodos.length} 条 · 已完成 ${done} · 今日汇入 ${linked}
          </div>
          ${groupsHtml}
        </div>
      </div>
      <div class="todo-col">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="font-size:15px;font-weight:700;color:var(--text-main);">📆 日程</div>
            <button class="btn btn-pink btn-sm" onclick="showAddScheduleModal()">＋ 添加日程</button>
          </div>
          <div class="sched-list">${schedHtml}</div>
        </div>
      </div>
    </div>
  `;
}

function toggleMonthCard(section, month) {

// ====================================================================
function getWeekKey() {
  const d = new Date();
  const day = d.getDay(); // 0=周日 .. 6=周六
  const diff = (day === 0 ? -6 : 1 - day); // 偏移到本周一
  const mon = new Date(d); mon.setDate(d.getDate() + diff);
  const y = mon.getFullYear();
  const m = String(mon.getMonth() + 1).padStart(2, '0');
  const dd = String(mon.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function getWeekRangeText() {
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  const mon = new Date(d); mon.setDate(d.getDate() + diff);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const f = (x) => `${x.getMonth() + 1}/${x.getDate()}`;
  return `${f(mon)} - ${f(sun)}`;
}

const LUNCH_DAYS = [
  { key: '1', label: '周一' },
  { key: '2', label: '周二' },
  { key: '3', label: '周三' },
  { key: '4', label: '周四' },
  { key: '5', label: '周五' }
];

function getLunchWeekdayDate(dayKey) {
  var d = new Date();
  var day = d.getDay();              // 0=周日 .. 6=周六
  var diff = (day === 0 ? -6 : 1 - day); // 偏移到本周一
  var mon = new Date(d); mon.setDate(d.getDate() + diff);
  var target = new Date(mon);
  target.setDate(mon.getDate() + (parseInt(dayKey, 10) - 1));
  return target;
}

function getTodayLunchKey() {
  var day = new Date().getDay();
  if (day >= 1 && day <= 5) return String(day);
  return null; // 周末不标记
}

function getLunch() {
  var raw = localStorage.getItem('lxk_lunch_' + getWeekKey());
  var empty = function () { return { days: { '1': [], '2': [], '3': [], '4': [], '5': [] }, notes: '' }; };
  if (!raw) return empty();
  try {
    var obj = JSON.parse(raw);
    if (Array.isArray(obj.items)) {
      // 旧版整周格式迁移：统一放到周一
      return { days: { '1': obj.items, '2': [], '3': [], '4': [], '5': [] }, notes: obj.notes || '' };
    }
    var days = obj.days || {};
    return {
      days: {
        '1': days['1'] || [], '2': days['2'] || [], '3': days['3'] || [],
        '4': days['4'] || [], '5': days['5'] || []
      },
      notes: obj.notes || ''
    };
  } catch (e) { return empty(); }
}

function saveLunch(lunch) {
  localStorage.setItem('lxk_lunch_' + getWeekKey(), JSON.stringify(lunch));
}

function renderLunchMenu(container) {
  const foodEmojis = ['🍚','🥗','🍗','🐟','🥩','🍜','🍲','🥟','🧆','🥘','🍛','🥪','🌮','🌯','🍔','🍟','🍕','🥙','🍱'];
  const lunch = getLunch();
  const todayKey = getTodayLunchKey();
  let total = 0;
  LUNCH_DAYS.forEach(d => total += (lunch.days[d.key] || []).length);

  const cols = LUNCH_DAYS.map(d => {
    const items = lunch.days[d.key] || [];
    const dt = getLunchWeekdayDate(d.key);
    const dateStr = (dt.getMonth() + 1) + '/' + dt.getDate();
    const listHtml = items.length === 0
      ? `<div class="lunch-col-empty">还没有记录～</div>`
      : items.map((item, i) => `
          <div class="lunch-item">
            <span class="li-emoji">${foodEmojis[i % foodEmojis.length]}</span>
            <span class="li-name">${escHtml(item)}</span>
            <button class="task-delete" onclick="deleteLunchItem('${d.key}',${i})">✕</button>
          </div>`).join('');
    return `
      <div class="lunch-col ${todayKey ? 'today' : ''}">
        <div class="lunch-col-head">
          <span class="lunch-col-day">${d.label}${todayKey === d.key ? ' · 今天' : ''}</span>
          <span class="lunch-col-date">${dateStr}</span>
        </div>
        <div class="lunch-col-add">
          <input type="text" class="input" id="lunch-input-${d.key}" placeholder="加菜..." onkeypress="if(event.key==='Enter')addLunchItem('${d.key}')">
          <button class="btn btn-primary" onclick="addLunchItem('${d.key}')">添加</button>
        </div>
        <div class="lunch-col-list">${listHtml}</div>
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="page-header">
      <span class="ph-icon">${DOG_ICONS['lunch-menu']}</span>
      <span class="ph-title">午饭菜单</span>
      <span class="ph-desc">本周菜单 · 每周一更新 · 周一到周五分列</span>
    </div>
    <div class="card">
      <div style="font-size:13px;color:var(--text-sub);margin-bottom:14px;">
        📅 本周（${getWeekRangeText()}）· 共 ${total} 道菜
      </div>
      <div class="lunch-grid">${cols}</div>
      <div style="margin-top:18px;">
        <label style="font-size:13px;color:var(--text-sub);display:block;margin-bottom:6px;">本周备注 / 感受</label>
        <textarea class="textarea" id="lunch-notes" placeholder="这周午饭怎么样？">${escHtml(lunch.notes || '')}</textarea>
        <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="saveLunchNotes()">保存备注</button>
      </div>
    </div>
  `;
}

  const el = document.getElementById('lunch-input-' + dayKey);
  const val = (text !== undefined && text !== null) ? String(text).trim() : (el ? el.value.trim() : '');
  if (!val) return;
  const lunch = getLunch();
  if (!lunch.days[dayKey]) lunch.days[dayKey] = [];
  lunch.days[dayKey].push(val);

}

function getModuleColor(id) {
  const colors = { eco: '#F4A460', biz: '#95C99C', piano: '#C8A6D4' };

  const palette = ['#F4A460','#95C99C','#C8A6D4','#E8A0BF','#A3C6E0','#D4A373'];

  for (let i = 0; i < id.length; i++) hash = ((hash << 5) - hash) + id.charCodeAt(i);

}

function ringSvg(value, max, color) {
  const v = Math.max(0, Math.min(value, max));
  const r = 32;
  const c = 2 * Math.PI * r;
  const off = c * (1 - (max ? v / max : 0));
  return `<svg viewBox="0 0 80 80" class="ring-svg">
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="8"/>
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 40 40)"/>
    <text x="40" y="40" class="ring-num" text-anchor="middle" dominant-baseline="central">${value}</text>
  </svg>`;
}

function getReadingDayCounts() {
  const now = new Date();
  const dow = now.getDay();
  const diffToMon = (dow === 0 ? 6 : dow - 1);
  const monday = new Date(now); monday.setDate(now.getDate() - diffToMon); monday.setHours(0, 0, 0, 0);
  const sundayEnd = new Date(monday); sundayEnd.setDate(monday.getDate() + 7);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const yearStart = new Date(now.getFullYear(), 0, 1);
  let week = 0, month = 0, year = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith('lxk_daily_')) continue;
    const d = new Date(key.replace('lxk_daily_', ''));
    if (isNaN(d.getTime())) continue;
    let flagged = false;
    try { const obj = JSON.parse(localStorage.getItem(key)); flagged = !!(obj && obj.readingCheckin); } catch (e) {}
    if (!flagged) continue;
    if (d >= monday && d < sundayEnd) week++;
    if (d >= monthStart) month++;
    if (d >= yearStart) year++;
  }
  return { week, month, year };
}

    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; img.style.display = 'block'; };
    reader.readAsDataURL(fileEl.files[0]);
    return;
  }
  const url = document.getElementById('book-cover-url').value.trim();
  if (url) { img.src = url; img.style.display = 'block'; }
  else { img.style.display = 'none'; }
}

function getBookCoverInput() {
  const fileEl = document.getElementById('book-cover-file');
  if (fileEl && fileEl.files && fileEl.files[0]) {
    return fileToDataURL(fileEl.files[0]);
  }
  const urlEl = document.getElementById('book-cover-url');
  return Promise.resolve(urlEl ? urlEl.value.trim() : '');
}

function fileToDataURL(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 200, maxH = 300;
        let w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          const ratio = Math.min(maxW / w, maxH / h);
          w = Math.round(w * ratio); h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', 0.82)); }
        catch (err) { resolve(e.target.result); }
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

// ====================================================================
// SLEEP TRACKING (cross-day: 睡觉当天为 key，起床可跨到次日)
// ====================================================================
function fmtHM(ts) {
  if (!ts) return '--:--';
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

// 计算"这一夜"所属日期：凌晨 12 点前（<12 时）入睡/起床，归属到"昨天的夜"
// 例如 8/17 00:30 睡觉，记在 8/16 这夜，时长仍按真实时间戳 8/17 00:30 → 8/17 07:00 计算
function sleepNightKey(d) {
  if (d.getHours() < 12) {
    const y = new Date(d);
    y.setDate(y.getDate() - 1);
    return y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  }
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function sleepStats() {
  const all = Store.getSleep();
  const days = Object.keys(all);
  let total = 0, count = 0, okCount = 0, sleepDays = 0;
  days.forEach(day => {
    const r = all[day];
    if (r.sleep) sleepDays++;
    if (r.sleep && r.wake) {
      const hrs = (r.wake - r.sleep) / 3600000;
      if (hrs > 0 && hrs < 24) { total += hrs; count++; if (hrs >= 7) okCount++; }
    }
  });
  return { avg: count ? (total / count) : 0, okCount, sleepDays, completeCount: count };
}

function sleepCheckIn() {
  const now = new Date();
  const day = sleepNightKey(now);
  const all = Store.getSleep();
  const rec = all[day] || { sleep: null, wake: null };
  const cross = now.getHours() < 12;
  if (rec.sleep && rec.wake) { all[day] = { sleep: now.getTime(), wake: null }; }
  else { rec.sleep = now.getTime(); all[day] = rec; }
  Store.saveSleep(all);
  renderPage('sleep');
  showToast((cross ? '🌙 已按昨夜记录（跨天）' : '晚安～') + ' 睡觉时间 ' + fmtHM(now.getTime()) + ' 🌙');
}

function sleepWakeUp() {
  const now = Date.now();
  const all = Store.getSleep();
  let target = null;
  for (let i = 0; i <= 5; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const r = all[key];
    if (r && r.sleep && !r.wake) { target = key; break; }
  }
  if (!target) { showToast('请先打睡觉卡哦～ 或去补打 🛏️'); return; }
  all[target].wake = now;
  Store.saveSleep(all);
  const hrs = ((now - all[target].sleep) / 3600000).toFixed(1);
  renderPage('sleep');
  showToast('早安～ 睡眠 ' + hrs + ' 小时 ☀️');
}

function sleepBackfill() {
  const date = document.getElementById('sleep-bf-date').value;
  const type = document.getElementById('sleep-bf-type').value;
  const time = document.getElementById('sleep-bf-time').value;
  if (!date) { showToast('请选择日期'); return; }
  if (!time) { showToast('请选择时间'); return; }
  const all = Store.getSleep();
  const calKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  if (type === 'sleep') {
    const ts = new Date(date + 'T' + time + ':00').getTime();
    const key = sleepNightKey(new Date(ts));   // 按跨天归属：凌晨睡归到前一夜，避免同日期两夜互相覆盖
    const rec = all[key] || { sleep: null, wake: null };
    rec.sleep = ts;
    all[key] = rec;
    Store.saveSleep(all);
    closeModal();
    renderPage('sleep');
    showToast('已补打（' + key + ' 夜）睡觉卡 🌙');
  } else {
    // 起床：按"睡觉的日历日期 == 所选睡眠日"定位记录（凌晨睡也归到前一夜，不会和当晚冲突）
    const rec = Object.values(all).find(r => r.sleep && !r.wake && calKey(r.sleep) === date)
            || Object.values(all).find(r => r.sleep && calKey(r.sleep) === date);
    if (!rec) { showToast('请先补该日的睡觉卡～'); return; }
    const cand = new Date(date + 'T' + time + ':00');
    let wakeTs = cand.getTime();
    if (wakeTs <= rec.sleep) wakeTs = cand.setDate(cand.getDate() + 1); // 起床比睡觉早（如 23:00 睡 07:00 起）才顺延到次日
    rec.wake = wakeTs;
    Store.saveSleep(all);
    const hrs = ((rec.wake - rec.sleep) / 3600000).toFixed(1);
    closeModal();
    renderPage('sleep');
    showToast('已补打起床卡，睡眠 ' + hrs + 'h ☀️');
  }
}

function compressImageToDataURL(file, maxW, quality, targetBytes) {
  maxW = maxW || 800;
  quality = quality || 0.75;
  targetBytes = targetBytes || 120000; // 一日小记单张目标 120KB
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxW) {
          height = Math.round(height * (maxW / width));
          width = maxW;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // 迭代降质量，直到满足目标体积
        const qualities = [quality, 0.7, 0.6, 0.5, 0.45];
        for (const q of qualities) {
          const out = canvas.toDataURL('image/jpeg', q);
          if (out.length <= targetBytes) { resolve(out); return; }
        }
        // 仍超限则再缩一次尺寸
        const cv2 = document.createElement('canvas');
        const smaller = Math.max(480, Math.floor(maxW * 0.6));
        const ratio = smaller / width;
        cv2.width = smaller;
        cv2.height = Math.max(1, Math.round(height * ratio));
        cv2.getContext('2d').drawImage(img, 0, 0, cv2.width, cv2.height);
        resolve(cv2.toDataURL('image/jpeg', 0.45));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function addJournalImages(files) {
  if (!files || !files.length) return;
  const data = Store.getDaily();
  if (!data.journalImages) data.journalImages = [];
  if (data.journalImages.length >= 10) {
    showToast('每天最多插入 10 张图片～');
    document.getElementById('journal-img-input').value = '';
    return;
  }
  for (const file of files) {
    if (data.journalImages.length >= 10) break;
    if (!file.type || file.type.indexOf('image/') !== 0) continue;
    try {
      const src = await compressImageToDataURL(file, 800, 0.75);
      data.journalImages.push({ id: uid(), src });
    } catch (e) {
      console.error('图片压缩失败', e);
    }
  }
  Store.saveDaily(data);
  const box = document.getElementById('journal-images');
  if (box) box.innerHTML = renderJournalImages(data.journalImages);
  const indicator = document.getElementById('save-indicator');
  if (indicator) indicator.textContent = '✓ 已自动保存';
  const input = document.getElementById('journal-img-input');
  if (input) input.value = '';
}

function removeJournalImage(id) {
  const data = Store.getDaily();

  data.journalImages = data.journalImages.filter(x => x.id !== id);

}

// ====================================================================
// SCROLL PICKER（滚轮选择器：日期 YYYY-MM-DD / 时间 HH:MM）
// ====================================================================
const PICKER_ITEM_H = 44;
let _pickerCb = null, _pickerMode = null, _pickerDayTimer = null;

function pad2(n) { n = +n; return n < 10 ? '0' + n : '' + n; }

function fmtCNDate(v) {
  if (!v) return '';
  const p = String(v).split('-');
  if (p.length < 3) return v;
  const y = +p[0], m = +p[1], d = +p[2];
  const curY = new Date().getFullYear();
  return (y !== curY ? y + '年' : '') + m + '月' + d + '日';
}

function datePickerHtml(inputId, val, ph) {
  const label = val ? fmtCNDate(val) : (ph || '选择日期');
  return `<input type="hidden" id="${inputId}" value="${escAttr(val || '')}"><button type="button" class="picker-trigger" onclick="openDatePickerFor('${inputId}')">📅 <span id="${inputId}-label">${escHtml(label)}</span></button>`;
}
function timePickerHtml(inputId, val, ph, labelId) {
  labelId = labelId || (inputId + '-label');
  const label = val || (ph || '选择时间');
  return `<input type="hidden" id="${inputId}" value="${escAttr(val || '')}"><button type="button" class="picker-trigger" onclick="openTimePickerFor('${inputId}')">🕐 <span id="${labelId}">${escHtml(label)}</span></button>`;
}

function openDatePickerFor(inputId) {
  const inp = document.getElementById(inputId);
  openDatePicker(inp.value, v => {
    inp.value = v;
    const lbl = document.getElementById(inputId + '-label');
    if (lbl) lbl.textContent = v ? fmtCNDate(v) : '选择日期';
  });
}
function openTimePickerFor(inputId) {
  const inp = document.getElementById(inputId);
  openTimePicker(inp.value, v => {
    inp.value = v;
    const lbl = document.getElementById(inputId + '-label');
    if (lbl) lbl.textContent = v || '选择时间';
  });
}

function fillPickerCol(col, items, initIndex) {
  const wrap = col.querySelector('.picker-items');
  wrap.innerHTML = items.join('');
  col.scrollTop = Math.max(0, Math.min(items.length - 1, initIndex)) * PICKER_ITEM_H;
  pickerHighlight(col);
}
function pickerHighlight(col) {
  const idx = Math.round(col.scrollTop / PICKER_ITEM_H);
  col.querySelectorAll('.picker-item').forEach((it, i) => it.classList.toggle('sel', i === idx));
}

function openDatePicker(init, cb) {
  const cur = new Date();
  let y = cur.getFullYear(), m = cur.getMonth() + 1, d = cur.getDate();
  if (init && /^\d{4}-\d{2}-\d{2}$/.test(init)) { const p = init.split('-'); y = +p[0]; m = +p[1]; d = +p[2]; }
  const minYear = cur.getFullYear() - 5, maxYear = cur.getFullYear() + 5;
  _pickerCb = cb; _pickerMode = 'date';
  const overlay = document.createElement('div');
  overlay.className = 'picker-overlay'; overlay.id = 'scroll-picker';
  overlay.innerHTML = `
    <div class="picker-sheet" onclick="event.stopPropagation()">
      <div class="picker-header">选择日期</div>
      <div class="picker-wheels"><div class="picker-selband"></div>
        <div class="picker-col" data-unit="year"><div class="picker-items"></div></div>
        <div class="picker-col" data-unit="month"><div class="picker-items"></div></div>
        <div class="picker-col" data-unit="day"><div class="picker-items"></div></div>
      </div>
      <div class="picker-actions">
        <button class="btn btn-outline btn-sm" onclick="closePicker()">取消</button>
        <button class="btn btn-pink btn-sm" onclick="confirmPicker()">确定</button>
      </div>
    </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closePicker(); });
  document.body.appendChild(overlay);
  // 年
  const yItems = [];
  for (let i = minYear; i <= maxYear; i++) yItems.push(`<div class="picker-item" data-val="${i}">${i}年</div>`);
  fillPickerCol(overlay.querySelector('.picker-col[data-unit="year"]'), yItems, y - minYear);
  // 月
  const mItems = [];
  for (let i = 1; i <= 12; i++) mItems.push(`<div class="picker-item" data-val="${i}">${i}月</div>`);
  fillPickerCol(overlay.querySelector('.picker-col[data-unit="month"]'), mItems, m - 1);
  // 日
  buildDayCol(y, m, d, overlay);
  // 滚动高亮 + 动态调整天数
  overlay.querySelectorAll('.picker-col').forEach(col => {
    col.addEventListener('scroll', () => pickerHighlight(col));
  });
  overlay.querySelector('.picker-col[data-unit="year"]').addEventListener('scroll', rebuildDayOnScroll);
  overlay.querySelector('.picker-col[data-unit="month"]').addEventListener('scroll', rebuildDayOnScroll);
  requestAnimationFrame(() => overlay.classList.add('show'));
}

function buildDayCol(y, m, d, overlay) {
  overlay = overlay || document.getElementById('scroll-picker');
  const max = new Date(y, m, 0).getDate();
  const items = [];
  for (let i = 1; i <= max; i++) items.push(`<div class="picker-item" data-val="${i}">${i}日</div>`);
  fillPickerCol(overlay.querySelector('.picker-col[data-unit="day"]'), items, Math.min(d, max) - 1);
}

function rebuildDayOnScroll() {
  clearTimeout(_pickerDayTimer);
  _pickerDayTimer = setTimeout(() => {
    const overlay = document.getElementById('scroll-picker');
    if (!overlay) return;
    const yc = overlay.querySelector('.picker-col[data-unit="year"]');
    const mc = overlay.querySelector('.picker-col[data-unit="month"]');
    const dc = overlay.querySelector('.picker-col[data-unit="day"]');
    if (!yc || !mc || !dc) return;
    const yi = Math.round(yc.scrollTop / PICKER_ITEM_H);
    const mi = Math.round(mc.scrollTop / PICKER_ITEM_H);
    const di = Math.round(dc.scrollTop / PICKER_ITEM_H);
    const y = +yc.querySelector('.picker-items').children[yi].dataset.val;
    const m = +mc.querySelector('.picker-items').children[mi].dataset.val;
    const dItem = dc.querySelector('.picker-items').children[di];
    const curD = dItem ? +dItem.dataset.val : 1;
    buildDayCol(y, m, curD, overlay);
  }, 160);
}

function openTimePicker(init, cb) {
  let h = new Date().getHours(), mi = 0;
  if (init && /^\d{1,2}:\d{2}$/.test(init)) { const p = init.split(':'); h = +p[0]; mi = +p[1]; }
  _pickerCb = cb; _pickerMode = 'time';
  const overlay = document.createElement('div');
  overlay.className = 'picker-overlay'; overlay.id = 'scroll-picker';
  overlay.innerHTML = `
    <div class="picker-sheet" onclick="event.stopPropagation()">
      <div class="picker-header">选择时间</div>
      <div class="picker-wheels"><div class="picker-selband"></div>
        <div class="picker-col" data-unit="hour"><div class="picker-items"></div></div>
        <div class="picker-col" data-unit="minute"><div class="picker-items"></div></div>
      </div>
      <div class="picker-actions">
        <button class="btn btn-outline btn-sm" onclick="closePicker()">取消</button>
        <button class="btn btn-pink btn-sm" onclick="confirmPicker()">确定</button>
      </div>
    </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closePicker(); });
  document.body.appendChild(overlay);
  const hItems = [];
  for (let i = 0; i <= 23; i++) hItems.push(`<div class="picker-item" data-val="${i}">${pad2(i)}时</div>`);
  fillPickerCol(overlay.querySelector('.picker-col[data-unit="hour"]'), hItems, h);
  const miItems = [];
  for (let i = 0; i <= 59; i++) miItems.push(`<div class="picker-item" data-val="${i}">${pad2(i)}分</div>`);
  fillPickerCol(overlay.querySelector('.picker-col[data-unit="minute"]'), miItems, mi);
  overlay.querySelectorAll('.picker-col').forEach(col => {
    col.addEventListener('scroll', () => pickerHighlight(col));
  });
  requestAnimationFrame(() => overlay.classList.add('show'));
}

function confirmPicker() {
  const overlay = document.getElementById('scroll-picker');
  if (!overlay) return;
  const vals = {};
  overlay.querySelectorAll('.picker-col').forEach(c => {
    const idx = Math.round(c.scrollTop / PICKER_ITEM_H);
    const item = c.querySelector('.picker-items').children[idx];
    vals[c.dataset.unit] = item ? item.dataset.val : '';
  });
  const v = _pickerMode === 'date'
    ? `${vals.year}-${pad2(vals.month)}-${pad2(vals.day)}`
    : `${pad2(vals.hour)}:${pad2(vals.minute)}`;
  closePicker();
  if (_pickerCb) _pickerCb(v);
}

function closePicker() {
  const overlay = document.getElementById('scroll-picker');
  if (!overlay) return;
  overlay.classList.remove('show');
  setTimeout(() => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 300);
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')

function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('lxk_')) {
      data[key] = localStorage.getItem(key);
    }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = 'lixiaoxin-backup-' + ts + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出备份文件，可拷贝到其它设备导入～');
}

function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const obj = JSON.parse(e.target.result);
      let count = 0;
      for (const key in obj) {
        if (key.startsWith('lxk_')) {
          localStorage.setItem(key, obj[key]);
          count++;
        }
      }
      if (count === 0) { showToast('文件中没有工作台数据'); return; }
      showToast('已导入 ' + count + ' 项数据，正在刷新…');
      initDogIcons();
      renderPage('dashboard');
    } catch (err) {
      showToast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  document.getElementById('import-file').value = '';
}

// ====================================================================
// ====================================================================
// CLOUD SYNC — Gitee（国内稳定 · 纯 REST API · 无需任何 SDK）
// ====================================================================
const GB_TOKEN_KEY  = 'lxk_gitee_token';
const GB_OWNER_KEY  = 'lxk_gitee_owner';
const GB_REPO_KEY   = 'lxk_gitee_repo';
const GB_BRANCH_KEY = 'lxk_gitee_branch';
const GB_FILE_KEY   = 'lxk_gitee_file';
const GB_DEVICE_KEY  = 'lxk_gitee_device';
const GB_BASEREV_KEY = 'lxk_gitee_baserev';
const GB_AUTOPULL_KEY = 'lxk_gitee_autopull';
let gbPushTimer = null;
let gbApplying = false;   // 正在把云端数据写入本机（此时不要反向推送）
let gbPullDone = false;   // 首次云端拉取是否已完成（未完成前禁止推送，防止旧数据覆盖云端）
let gbLastSync = '';      // 最近一次成功上传时间
let gbCloudEmpty = false; // 云端尚无数据（只有这种情况才允许把本机数据直接初始化上去）
let gbConflictOpen = false; // 存在未处理的版本冲突，暂停自动上传
let gbCloudMeta = null;   // 最近一次读到的云端版本信息
let gbPushing = false;    // 上传进行中（防止重入引发弹窗连环触发）
let gbPullTimer = null;   // 周期拉取定时器
let gbPulling = false;    // 正在拉取（防止重叠拉取）
let gbAutoPull = (localStorage.getItem(GB_AUTOPULL_KEY) || '1') !== '0'; // 默认开启自动拉取

// ===== 内置云端同步配置（避免每次重填） =====
// 安全说明：这是纯前端单文件网页，令牌无法真正隐藏。这里仅用 base64 做简单混淆（防随手查看），
// 懂行的人仍能解码——请务必使用只对该私有仓库有读写权限、且可随时在 Gitee 撤销的令牌。
// 非敏感项（owner/repo/branch/file）直接写死；敏感项 token 用 base64 混淆存储。
const GB_BUILTIN_CONFIG = {
  owner:  'labixiao-xinxin',
  repo:   'li-xiaoxins-workstation',
  branch: 'master',
  file:   '2450476089@qq.com',
  tokenB64: 'MDk0YTc5ZGY5YThjZjNmZDU3NjY1OTI5ZmMzM2E5Njk='
};
function gbBuiltinToken() {
  try { return b64dec(GB_BUILTIN_CONFIG.tokenB64); } catch (e) { return ''; }
}
// 本地没有配置时，用内置配置自动填充（仅首次/被清空后），避免每次重填
function gbApplyBuiltinIfEmpty() {
  if (localStorage.getItem(GB_TOKEN_KEY)) return; // 已存在本地配置，尊重用户手动改动
  if (!GB_BUILTIN_CONFIG.owner || !GB_BUILTIN_CONFIG.repo || !GB_BUILTIN_CONFIG.file) return;
  writeSyncConfig({
    token:  gbBuiltinToken(),
    owner:  GB_BUILTIN_CONFIG.owner,
    repo:   GB_BUILTIN_CONFIG.repo,
    branch: GB_BUILTIN_CONFIG.branch || 'master',
    file:   GB_BUILTIN_CONFIG.file
  });

// 更新侧边栏同步状态指示
function gbSetStatus(state, text) {
  const el = typeof document !== 'undefined' && document.getElementById('sync-indicator');
  const tx = typeof document !== 'undefined' && document.getElementById('sync-indicator-text');
  if (!el) return;
  el.className = 'sync-indicator' + (state ? ' ' + state : '');
  if (tx) tx.textContent = text;
}
function gbRefreshStatus() {
  if (!gbReady()) { gbSetStatus('off', '未开启同步'); return; }
  if (gbConflictOpen) { gbSetStatus('busy', '有版本冲突，已暂停'); return; }
  if (gbPushing || gbPulling) { gbSetStatus('busy', '同步中…'); return; }
  if (!gbPullDone) { gbSetStatus('busy', '连接云端中…'); return; }
  gbSetStatus('', '实时同步中 ☁️');
}

// 仓库连接配置属于本机设置，不参与同步（也避免把令牌明文写进仓库文件）
function isSyncKey(k) { return !!k && k.startsWith('lxk_') && !k.startsWith('lxk_gitee_'); }

// ---- 版本控制：云端文件带单调递增版本号，本机记住「我这份数据基于第几版」----
function gbDeviceName() {
  let id = localStorage.getItem(GB_DEVICE_KEY);
  if (!id) {
    const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
    const kind = /iPhone|iPad|iPod|Android|HarmonyOS|Mobile/i.test(ua) ? '手机' : '电脑';
    id = kind + '-' + Math.random().toString(36).slice(2, 6);
    localStorage.setItem(GB_DEVICE_KEY, id);
  }
  return id;
}
function gbBaseRev() { return parseInt(localStorage.getItem(GB_BASEREV_KEY) || '0', 10) || 0; }
function gbSetBaseRev(r) { localStorage.setItem(GB_BASEREV_KEY, String(r || 0)); }
function gbFmtTime(iso) {
  if (!iso) return '未知时间';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? String(iso) : d.toLocaleString('zh-CN', { hour12: false });
}
// 云端结构：{ __meta:{ rev, updatedAt, device }, data:{ lxk_xxx: "..." } }
// 兼容历史扁平格式（无 __meta，整个对象就是 data，按第 0 版处理）
function parseRemote(text) {
  let obj = null;
  try { obj = JSON.parse(text); } catch (e) { return null; }
  if (!obj || typeof obj !== 'object') return null;
  if (obj.__meta && obj.data) {
    return { rev: parseInt(obj.__meta.rev, 10) || 0, meta: obj.__meta, data: obj.data };
  }
  return { rev: 0, meta: { rev: 0, updatedAt: '', device: '旧版本（无版本号）' }, data: obj };
}

function gbReady() {
  return !!localStorage.getItem(GB_TOKEN_KEY) && !!localStorage.getItem(GB_OWNER_KEY)
      && !!localStorage.getItem(GB_REPO_KEY) && !!localStorage.getItem(GB_FILE_KEY);
}
function gbFilePath() {
  const id = localStorage.getItem(GB_FILE_KEY) || 'lixiaoxin';
  return 'workbench/' + encodeURIComponent(id) + '.json';
}
function gbApi() {
  const owner = localStorage.getItem(GB_OWNER_KEY);
  const repo  = localStorage.getItem(GB_REPO_KEY);
  return 'https://gitee.com/api/v5/repos/' + owner + '/' + repo + '/contents/' + gbFilePath();
}
function gbBranch() { return localStorage.getItem(GB_BRANCH_KEY) || 'master'; }
// 读取必须指定 ref=分支，否则读的是仓库默认分支，拿到的 sha 与写入分支对不上 → 永久 sha 冲突
function gbReadUrl() {
  const token = localStorage.getItem(GB_TOKEN_KEY);
  return gbApi() + '?access_token=' + encodeURIComponent(token)
    + '&ref=' + encodeURIComponent(gbBranch()) + '&_t=' + Date.now();
}
// 统一读取云端：返回 { ok, status, missing, sha, cloud }
async function gbFetchRemote() {
  try {
    const r = await fetch(gbReadUrl(), { cache: 'no-store' });
    if (r.status === 404) return { ok: true, status: 404, missing: true, sha: null, cloud: null };
    if (!r.ok) return { ok: false, status: r.status, missing: false, sha: null, cloud: null };
    const j = await r.json();
    return { ok: true, status: 200, missing: false, sha: j.sha || null, cloud: j.content ? parseRemote(b64dec(j.content)) : null };
  } catch (e) {
    return { ok: false, status: 0, missing: false, sha: null, cloud: null, error: e };
  }
}
// 写入云端：有 sha 用 PUT（更新），无 sha 用 POST（新建）。Gitee 两者路径相同、方法不同
async function gbWrite(content, sha, message) {
  const body = {
    access_token: localStorage.getItem(GB_TOKEN_KEY),
    message: message, content: content, branch: gbBranch()
  };
  if (sha) body.sha = sha;
  return fetch(gbApi(), {
    method: sha ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
}
// 判断错误文本是否属于「sha 不匹配 / 缺失 / 文件已存在」这类可通过刷新 sha 自愈的冲突
function gbIsShaIssue(text) {
  const t = (text || '').toLowerCase();
  return t.indexOf('sha') !== -1 || t.indexOf('已存在') !== -1 || t.indexOf('exist') !== -1;
}
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function collectPayload() {
  const payload = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (isSyncKey(k)) payload[k] = localStorage.getItem(k);
  }
  return payload;
}
function applyPayload(payload) {
  if (!payload) return;
  gbApplying = true;
  try {
    const remote = Object.keys(payload).filter(isSyncKey);
    const remoteSet = new Set(remote);
    // 云端已删除的项，本机也要删掉（例如在电脑上「复位」了某个图标）
    const localKeys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (isSyncKey(k)) localKeys.push(k);
    }
    localKeys.forEach(k => { if (!remoteSet.has(k)) localStorage.removeItem(k); });
    remote.forEach(k => localStorage.setItem(k, payload[k]));
  } finally {
    gbApplying = false;
  }
  // 外观类数据（主题 / 头像 / 导航图标）必须重新应用，否则要刷新才生效
  applyTheme(getTheme());
  applyNavIcons();
  applyAvatar();
  renderPage(typeof currentPage !== 'undefined' && currentPage ? currentPage : 'dashboard');
}
function scheduleSyncPush() {
  if (!gbReady() || gbApplying) return;
  if (!gbPullDone) return;     // 云端还没拉下来，先不上传，避免本机旧数据覆盖云端
  if (gbConflictOpen) return;  // 有未处理的版本冲突，先不要自动上传
  gbSetStatus('busy', '改动待同步…');
  clearTimeout(gbPushTimer);
  gbPushTimer = setTimeout(() => { gbPushTimer = null; syncPush(); }, 1200);
}
async function syncPush(verbose, force) {
  if (!gbReady()) return false;
  if (gbConflictOpen && !force) return false;
  if (gbPushing) return false;          // 防止重入导致弹窗连环触发
  gbPushing = true;
  gbSetStatus('busy', '同步中…');
  try {
    return await doSyncPush(verbose, force);
  } finally {
    gbPushing = false;
  }
}

async function doSyncPush(verbose, force) {
  // 上传前必须先看一眼云端当前版本，防止用本机旧快照覆盖别的设备刚提交的新版本
  const head = await gbFetchRemote();
  if (!head.ok) {
    showToast(head.status ? ('读不到云端版本（HTTP ' + head.status + '），已取消上传以免覆盖数据')
                          : '读不到云端版本（网络异常），已取消上传以免覆盖数据', 7000);
    return false;
  }

  const base = gbBaseRev();
  const cloud = head.cloud;
  if (cloud && cloud.rev > base && !force) {
    // 云端比本机基线新 —— 说明另一台设备在我之后改过，绝不覆盖，交给用户决定
    gbCloudMeta = cloud.meta;
    gbConflictOpen = true;
    showSyncConflict(cloud);
    return false;
  }

  const nextRev = (cloud ? cloud.rev : base) + 1;
  const content = b64enc(JSON.stringify({
    __meta: { rev: nextRev, updatedAt: new Date().toISOString(), device: gbDeviceName() },
    data: collectPayload()
  }));
  // Gitee 单文件 content（base64 后）限制约 1MB；留 25% 余量，超过 750KB 就拦截
  if (content.length > 750000) {
    showToast('同步包已达 ' + Math.round(content.length / 1024) + 'KB，超过云端 750KB 安全上限。请删除几张小记图片或复位部分图标/头像后再试。', 9000);
    return false;
  }
  const msg = 'workbench sync v' + nextRev + ' from ' + gbDeviceName();

  // 最多两轮：第一轮用刚读到的 sha；若报 sha 问题，刷新 sha 后自动重试一次
  let sha = head.sha;
  for (let attempt = 0; attempt < 2; attempt++) {
    let res;
    try {
      res = await gbWrite(content, sha, msg);
    } catch (e) {
      console.warn('syncPush network error', e);
      showToast('云端上传失败（网络异常），本次改动只存在这台设备', 7000);
      return false;
    }
    if (res.ok) {
      gbSetBaseRev(nextRev);
      gbCloudEmpty = false;
      gbConflictOpen = false;
      gbLastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      gbSetStatus('', '已同步 ☁️');
      if (verbose) showToast('已上传，云端现为第 ' + nextRev + ' 版 ☁️');
      return true;
    }

    const errText = await res.text().catch(() => '');
    let errMsg = '';
    try { const j = JSON.parse(errText); errMsg = j.message || j.error_description || ''; } catch (e) {}
    const combined = errMsg + ' ' + errText;
    saveSyncDiag({ phase: 'upload', status: res.status, kind: 'attempt' + attempt, message: errMsg,
      text: errText.slice(0, 800), url: gbApi(), branch: gbBranch(), sentSha: sha || '(none)',
      contentLength: content.length, at: new Date().toISOString() });

    // sha 失效 / 缺失 / 文件已存在 —— 重新取一次分支内的 sha 后重试
    if (attempt === 0 && gbIsShaIssue(combined)) {
      const again = await gbFetchRemote();
      if (again.ok) {
        // 若这次读到云端比本机新且不是强制上传，交给冲突弹窗
        if (!force && again.cloud && again.cloud.rev > base) {
          gbCloudMeta = again.cloud.meta;
          gbConflictOpen = true;
          showSyncConflict(again.cloud);
          return false;
        }
        sha = again.sha;   // 可能为 null（文件不存在）→ 下一轮走 POST 新建
        continue;
      }
      // 读不到云端：强制模式下尝试不带 sha 直接新建，否则交给用户决定
      if (force) { sha = null; continue; }
    }

    // 走到这里说明重试也失败了：给出明确原因，绝不再弹冲突窗（避免死循环）
    let hint = '';
    const t = combined.toLowerCase();
    if (gbIsShaIssue(combined)) hint = '（云端文件状态异常，建议在同步设置里点「测试连接」核对分支名是否为仓库真实分支）';
    else if (t.indexOf('branch') !== -1) hint = '（分支不存在或拼写错误）';
    else if (t.indexOf('token') !== -1 || res.status === 401) hint = '（令牌无效或已过期）';
    else if (res.status === 403) hint = '（令牌权限不足，需勾选 projects/repos 权限）';
    else if (res.status === 404) hint = '（仓库或路径不存在）';
    console.warn('syncPush failed', res.status, errText);
    showToast('云端上传失败（HTTP ' + res.status + (errMsg ? '：' + errMsg : '') + '）' + hint, 10000);
    gbConflictOpen = false;   // 解除暂停，允许用户重试，不卡死
    gbSetStatus('err', '上传失败，点设置查看');
    return false;
  }
  return false;
}

// 拉取云端版本元数据并判断冲突（只读，不写入本机数据）。allowSameRev=true 时只要云端内容存在就视为冲突（用于 sha 冲突时）
async function checkCloudConflict(reason, allowSameRev) {
  if (!gbReady()) return false;
  const head = await gbFetchRemote();
  if (!head.ok) { console.warn('checkCloudConflict fetch failed', head.status, reason); return false; }
  const cloud = head.cloud;
  const base = gbBaseRev();
  if (cloud && (cloud.rev > base || (allowSameRev && cloud.rev >= base))) {
    gbCloudMeta = cloud.meta;
    gbConflictOpen = true;
    showSyncConflict(cloud, allowSameRev && cloud.rev === base);
    return true;
  }
  return false;
}

// 版本冲突处理：本机数据基于旧版，云端已有更新的版本
function saveSyncDiag(info) {
  try { localStorage.setItem('lxk_gitee_diag', JSON.stringify(info)); } catch (e) {}
}
function loadSyncDiag() {
  try { return JSON.parse(localStorage.getItem('lxk_gitee_diag') || '{}'); } catch (e) { return {}; }
}
function showSyncConflict(cloud, sameRev) {
  gbSetStatus('busy', '有版本冲突，已暂停');
  const dev  = (cloud.meta && cloud.meta.device) || '其它设备';
  const when = gbFmtTime(cloud.meta && cloud.meta.updatedAt);
  const base = gbBaseRev();
  const revInfo = sameRev
    ? `云端和本机都标为 <b>第 ${cloud.rev} 版</b>，但内容不一致。`
    : `云端已是 <b>第 ${cloud.rev} 版</b>，本机数据基于 <b>第 ${base} 版</b>。`;
  showModal(`
    <div class="modal-title">⚠️ 云端有更新的版本</div>
    <div style="font-size:13px;color:var(--text-sub);line-height:1.9;margin-bottom:16px;">
      ${revInfo}<br>
      云端最后由 <b>${escHtml(dev)}</b> 于 ${escHtml(when)} 提交。<br>
      为避免把新数据覆盖掉，本次上传<b>已自动暂停</b>，请选择：
    </div>
    <div class="modal-actions" style="flex-direction:column;gap:8px;align-items:stretch;">
      <button class="btn btn-primary" style="width:100%;" onclick="resolveConflictPull()">⬇️ 采用云端第 ${cloud.rev} 版（推荐，放弃本机未上传的改动）</button>
      <button class="btn btn-danger" style="width:100%;" onclick="resolveConflictPush()">⬆️ 强制上传本机数据（覆盖云端第 ${cloud.rev} 版）</button>
      <button class="btn btn-outline" style="width:100%;" onclick="resolveConflictLater()">稍后再说（继续暂停自动上传）</button>
    </div>
  `);
}
function resolveConflictPull() { closeModal(); gbConflictOpen = false; showToast('正在采用云端版本…'); syncPull(true); }
function resolveConflictPush() { closeModal(); showToast('正在强制上传本机数据…'); syncPush(true, true); }
function resolveConflictLater() { closeModal(); showToast('已暂停自动上传，可稍后在同步设置里处理', 5000); }
// 云端 sha 冲突但无法读取详情时的兜底弹窗
function showSyncConflictUnknown() {
  showModal(`
    <div class="modal-title">⚠️ 云端文件有更新但无法读取详情</div>
    <div style="font-size:13px;color:var(--text-sub);line-height:1.9;margin-bottom:16px;">
      本次上传被云端拒绝（sha 冲突），说明云端文件已经被修改过，但二次读取详情失败。<br>
      请选择处理方式：
    </div>
    <div class="modal-actions" style="flex-direction:column;gap:8px;align-items:stretch;">
      <button class="btn btn-primary" style="width:100%;" onclick="resolveConflictPull()">⬇️ 先拉取云端数据</button>
      <button class="btn btn-danger" style="width:100%;" onclick="resolveConflictPush()">⬆️ 强制上传本机数据（覆盖云端）</button>
      <button class="btn btn-outline" style="width:100%;" onclick="resolveConflictLater()">稍后再说</button>
    </div>
  `);
}
async function syncPull(verbose) {
  if (!gbReady()) return false;
  gbPulling = true;
  gbSetStatus('busy', '同步中…');
  try {
    const head = await gbFetchRemote();
    if (head.missing) { // 云端还没有文件，允许首次初始化上传
      gbPullDone = true; gbCloudEmpty = true; gbCloudMeta = null; gbConflictOpen = false; gbSetBaseRev(0);
      if (verbose) showToast('云端暂无数据（分支 ' + gbBranch() + '），可点「立即上传」初始化', 5000);
      return true;
    }
    if (!head.ok) {
      saveSyncDiag({ phase: 'pull', status: head.status, url: gbApi(), branch: gbBranch(), at: new Date().toISOString() });
      showToast(head.status ? ('云端拉取失败（HTTP ' + head.status + '），已暂停上传以免覆盖云端数据')
                            : '云端拉取失败（网络异常），已暂停上传以免覆盖云端数据', 7000);
      return false;
    }
    const parsed = head.cloud;
    const prevBase = gbBaseRev();
    if (parsed && parsed.data && Object.keys(parsed.data).length) {
      gbCloudEmpty = false;
      gbCloudMeta = parsed.meta;
      // 只接受云端比本机新的版本；rev 为 0 表示没有版本号的历史格式，无法判断，也采用
      if ((parsed.rev > prevBase) || parsed.rev === 0) {
        applyPayload(parsed.data);
        gbSetBaseRev(parsed.rev);
        gbConflictOpen = false;
        if (verbose) showToast('已同步云端第 ' + parsed.rev + ' 版（' + ((parsed.meta && parsed.meta.device) || '未知设备')
          + ' · ' + gbFmtTime(parsed.meta && parsed.meta.updatedAt) + '）', 4500);
      } else if (parsed.rev < prevBase) {
        // 云端版本反而比本机旧：可能是云端被回退或另一台设备用了旧格式覆盖，不能盲目拉取
        gbConflictOpen = true;
        showSyncConflict(parsed);
      } else {
        gbConflictOpen = false;
        if (verbose) showToast('本机已是最新（第 ' + parsed.rev + ' 版）');
      }
    } else {
      gbCloudEmpty = true; gbCloudMeta = null; gbConflictOpen = false; gbSetBaseRev(0);
      if (verbose) showToast('云端暂无数据，可点「立即上传」初始化');
    }
    gbPullDone = true;
    return true;
  } finally {
    gbPulling = false;
    gbRefreshStatus();
  }
}
// 手动同步
function manualPull() { closeModal(); showToast('正在从云端拉取…'); syncPull(true); }
function manualPush() {
  closeModal();
  if (!gbPullDone) { showToast('尚未成功连接云端，请先「立即拉取」'); return; }
  gbConflictOpen = false; // 允许重新检测；若云端确实更新会再次弹出冲突提示
  showToast('正在上传到云端…');
  syncPush(true);
}
function manualForcePush() {
  closeModal();
  if (!gbPullDone) { showToast('尚未成功连接云端，请先「立即拉取」'); return; }
  showModal(`
    <div class="modal-title">⚠️ 强制覆盖上传</div>
    <div style="font-size:13px;color:var(--text-sub);line-height:1.8;margin-bottom:16px;">
      这会用本机数据<b>直接覆盖</b>云端文件，不检查版本。<br>
      如果其它设备有未同步的新数据，会被覆盖掉。<br>
      确定要继续吗？
    </div>
    <div class="modal-actions" style="flex-direction:column;gap:8px;align-items:stretch;">
      <button class="btn btn-danger" style="width:100%;" onclick="closeModal(); showToast('正在强制覆盖上传…'); syncPush(true, true);">⬆️ 确定强制覆盖</button>
      <button class="btn btn-outline" style="width:100%;" onclick="rebuildCloudFile()">🧹 仍失败？删除并重建云端文件</button>
      <button class="btn btn-outline" style="width:100%;" onclick="closeModal(); showToast('已取消');">取消</button>
    </div>
  `);

// 终极兜底：删除云端文件后用本机数据重新创建（绕开一切 sha / 格式异常）
async function rebuildCloudFile() {
  closeModal();
  if (!gbReady()) { showToast('请先配置云端同步'); return; }
  showToast('正在重建云端文件…');
  const token = localStorage.getItem(GB_TOKEN_KEY);
  const head = await gbFetchRemote();
  if (!head.ok) { showToast('读不到云端状态（HTTP ' + head.status + '），重建已取消', 7000); return; }
  if (head.sha) {
    try {
      const del = await fetch(gbApi(), {
        method: 'DELETE', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: token, message: 'rebuild by ' + gbDeviceName(), sha: head.sha, branch: gbBranch() })
      });
      if (!del.ok) {
        const e = await del.json().catch(() => ({}));
        showToast('删除云端旧文件失败：' + (e.message || del.status), 8000);
        return;
      }
    } catch (e) { showToast('删除云端旧文件失败（网络异常）', 7000); return; }
  }
  // 删除成功后云端为空，重置基线再走正常上传（此时会走 POST 新建）
  gbSetBaseRev(0);
  gbCloudEmpty = true;
  gbCloudMeta = null;
  gbConflictOpen = false;
  gbPullDone = true;
  const ok = await syncPush(true, true);
  showToast(ok ? '云端文件已重建，现在是第 1 版 ✅（其它设备请点「立即拉取」）' : '重建失败，请查看同步设置里的诊断信息', 9000);
}
// 切回页面时自动拉取一次（手机端不用重开网页也能拿到最新数据）
let gbLastPullAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!gbReady() || gbPushTimer) return;
  if (Date.now() - gbLastPullAt < 20000) return;
  gbLastPullAt = Date.now();
  syncPull();
});

// 周期自动拉取：让其它设备的改动也能「随时」同步到本机（默认每 30 秒）
function startAutoPull() {
  clearInterval(gbPullTimer);
  gbPullTimer = null;
  if (!gbAutoPull) return;
  gbPullTimer = setInterval(() => {
    if (!gbReady() || gbApplying || gbPushing || gbPulling) return;
    if (gbConflictOpen || !gbPullDone) return;
    syncPull(false);
  }, 30000);
}
function setAutoPull(on) {
  gbAutoPull = !!on;
  localStorage.setItem(GB_AUTOPULL_KEY, gbAutoPull ? '1' : '0');
  startAutoPull();
  gbRefreshStatus();
  showToast(gbAutoPull ? '已开启实时拉取（每 30 秒同步其它设备改动）' : '已关闭自动拉取');
}

function getPayloadStats() {
  const payload = collectPayload();
  const json = JSON.stringify({ __meta: { rev: 0 }, data: payload });
  const content = b64enc(json);
  const items = Object.keys(payload).map(k => ({ k, len: (payload[k] || '').length })).sort((a, b) => b.len - a.len).slice(0, 8);
  return { jsonLen: json.length, contentLen: content.length, items };
}
function renderSyncDiag() {
  const stats = getPayloadStats();
  const diag = loadSyncDiag();
  let html = '<div style="font-size:12px;color:var(--text-sub);margin-top:12px;padding:10px;background:var(--cream-card);border-radius:10px;line-height:1.7;">';
  html += '<div style="font-weight:600;color:var(--text-main);margin-bottom:6px;">📊 同步包诊断</div>';
  html += '<div>当前同步包（base64 后）：<b>' + Math.round(stats.contentLen / 1024) + ' KB</b> / 上限 750 KB</div>';
  html += '<div style="margin-top:6px;">占用最大的键（Top 5）：</div>';
  html += '<ul style="margin:4px 0 0 16px;padding:0;font-size:11px;">';
  stats.items.slice(0, 5).forEach(it => {
    html += '<li><code>' + escHtml(it.k) + '</code>：' + Math.round(it.len / 1024) + ' KB</li>';
  });
  html += '</ul>';
  if (diag && diag.status) {
    html += '<div style="margin-top:8px;color:var(--accent-red);">最近一次失败：HTTP ' + diag.status;
    if (diag.kind) html += ' ' + escHtml(diag.kind);
    html += '<br><span style="color:var(--text-light);font-size:11px;">' + escHtml((diag.message || diag.text || '').slice(0, 200)) + '</span></div>';
  }
  html += '<button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="copySyncDiag()">复制完整诊断信息</button>';
  html += '</div>';
  return html;
}
function copySyncDiag() {
  const stats = getPayloadStats();
  const diag = loadSyncDiag();
  const text = '同步包大小：' + Math.round(stats.contentLen / 1024) + 'KB\n最大键：\n' + stats.items.map(it => '- ' + it.k + '：' + Math.round(it.len / 1024) + 'KB').join('\n') + '\n最近失败：' + JSON.stringify(diag, null, 2);
  navigator.clipboard.writeText(text).then(() => showToast('诊断信息已复制'), () => showToast('复制失败，请手动截图'));
}

function readSyncForm() {
  if (typeof document === 'undefined' || !document.getElementById('gb-token')) return null;
  const token  = document.getElementById('gb-token').value.trim();
  const owner  = document.getElementById('gb-owner').value.trim();
  const repo   = document.getElementById('gb-repo').value.trim();
  const branch = document.getElementById('gb-branch').value.trim() || 'master';
  const file   = document.getElementById('gb-file').value.trim();
  if (!token || !owner || !repo || !file) return null;
  return { token, owner, repo, branch, file };
}
function writeSyncConfig(cfg) {
  localStorage.setItem(GB_TOKEN_KEY, cfg.token);
  localStorage.setItem(GB_OWNER_KEY, cfg.owner);
  localStorage.setItem(GB_REPO_KEY, cfg.repo);
  localStorage.setItem(GB_BRANCH_KEY, cfg.branch);
  localStorage.setItem(GB_FILE_KEY, cfg.file);
}
async function saveSync() {
  const cfg = readSyncForm();
  if (!cfg) { showToast('请填写完整'); return; }
  const prevFile  = localStorage.getItem(GB_FILE_KEY);
  const prevRepo  = localStorage.getItem(GB_REPO_KEY);
  const prevOwner = localStorage.getItem(GB_OWNER_KEY);
  writeSyncConfig(cfg);
  // 换了仓库/同步标识 = 换了一份数据，本机的版本基线立即作废，必须重新以云端为准
  if (prevFile !== cfg.file || prevRepo !== cfg.repo || prevOwner !== cfg.owner) {
    gbSetBaseRev(0); gbPullDone = false; gbConflictOpen = false;
  }
  closeModal();
  showToast('已配置，正在拉取云端数据…');
  const ok = await syncPull(false);
  startAutoPull();
  gbRefreshStatus();
  if (!ok) { showToast('云端未连通，本机改动暂不会上传（可用「测试连接」排查）', 6000); return; }
  // 关键：连接成功后【不】自动回推本机数据，避免这台设备的旧快照覆盖别处刚改的新版本。
  // 只有云端确实是空的（首次建立同步）才做一次初始化上传。
  if (gbCloudEmpty) { showToast('云端暂无数据，正在初始化上传…'); await syncPush(true); }
}

function clearSync() {
  localStorage.removeItem(GB_TOKEN_KEY);
  localStorage.removeItem(GB_OWNER_KEY);
  localStorage.removeItem(GB_REPO_KEY);
  localStorage.removeItem(GB_BRANCH_KEY);
  localStorage.removeItem(GB_FILE_KEY);
  gbSetBaseRev(0);
  gbPullDone = false; gbConflictOpen = false; gbCloudEmpty = false; gbCloudMeta = null;
  startAutoPull();
  gbRefreshStatus();
  closeModal();
  showToast('已断开云端同步');
}

// 真实连接测试：验证能否对 Gitee 仓库读写
async function testConnection(showOk) {
  const cfg = readSyncForm();
  if (!cfg) { showToast('请先填写完整配置'); return; }
  writeSyncConfig(cfg); // 暂存到 localStorage，让 gbApi()/gbReady() 可用
  const token = cfg.token;
  const branch = cfg.branch;
  const repoApi = 'https://gitee.com/api/v5/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo);
  showToast('正在测试连接…');
  try {
    // 1) 先验证仓库本身能否被该令牌访问
    const rr = await fetch(repoApi + '?access_token=' + encodeURIComponent(token));
    if (rr.status === 404) { showToast('仓库不存在：请核对「用户名 + 仓库名」拼写是否与 Gitee 地址栏一致', 7000); return false; }
    if (rr.status === 401 || rr.status === 403) { showToast('令牌无权限：请确认该令牌属于 ' + cfg.owner + ' 账号且已勾 projects', 7000); return false; }
    if (!rr.ok) { showToast('连接失败：HTTP ' + rr.status, 6000); return false; }
    const repoInfo = await rr.json().catch(() => ({}));
    const useBranch = repoInfo.default_branch || branch; // 用仓库真实默认分支
    if (repoInfo.default_branch) localStorage.setItem(GB_BRANCH_KEY, repoInfo.default_branch); // 同步真实分支，避免填错
    // 2) 尝试读写数据文件（读必须带 ref，保证与写入分支一致）
    const r = await fetch(gbApi() + '?access_token=' + encodeURIComponent(token) + '&ref=' + encodeURIComponent(useBranch));
    if (r.status === 401 || r.status === 403) { showToast('令牌无权访问仓库内容', 6000); return false; }
    if (r.status === 404) {
      // 新建文件必须用 POST（PUT 是更新，会要求 sha）
      const w = await gbWrite(b64enc('{}'), null, 'sync test');
      if (!w.ok) { const e = await w.json().catch(()=>({})); showToast('仓库不可写：' + (e.message || w.status), 7000); return false; }
      // 注意：这里只创建空文件即可，不再做二次覆盖写，避免误删同一时刻其它设备刚上传的数据
      gbCloudEmpty = true;
      if (showOk) showToast('连接成功，可正常读写 ✅（默认分支 ' + useBranch + '）'); return true;
    }
    if (!r.ok) { showToast('连接失败：HTTP ' + r.status, 6000); return false; }
    if (showOk) showToast('连接成功，可正常读写 ✅（默认分支 ' + useBranch + '）'); return true;
  } catch (e) {
    showToast('连接异常：' + (e.message || e), 6000); console.warn('testConnection fail', e); return false;
  }
}

// 自动推送：拦截所有 lxk_ 写入，防抖后上传云端
(function patchLocalStorage() {
  const _set = Storage.prototype.setItem;
  const _remove = Storage.prototype.removeItem;
  Storage.prototype.setItem = function(k, v) {
    const r = _set.call(this, k, v);
    if (isSyncKey(k) && !gbApplying) scheduleSyncPush();
    return r;
  };
  // 删除同样要同步（例如图标/头像「复位」），否则其它设备永远删不掉
  Storage.prototype.removeItem = function(k) {
    const r = _remove.call(this, k);
    if (isSyncKey(k) && !gbApplying) scheduleSyncPush();
    return r;
  };
})();
