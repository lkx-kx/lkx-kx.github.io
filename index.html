<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>李小欣工作台</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<style>
:root {
  --cream-bg: #FFF8E7;
  --cream-side: #FDF3D8;
  --cream-card: #FFFDF7;
  --cream-card-hover: #FFFAEF;
  --accent-caramel: #D4A373;
  --accent-pink: #E8A0BF;
  --accent-green: #95C99C;
  --accent-blue: #A3C6E0;
  --accent-purple: #C8A6D4;
  --accent-orange: #F4A460;
  --text-main: #5D4037;
  --text-sub: #8D6E63;
  --text-light: #BCAAA4;
  --border-soft: #F0E0C0;
  --shadow-soft: 0 2px 14px rgba(150, 150, 180, 0.12);
  --shadow-card: 0 6px 24px rgba(140, 150, 180, 0.16);
  --radius: 22px;
  --radius-sm: 10px;
  --radius-lg: 22px;
  --glass-bg: rgba(255, 255, 255, 0.30);
  --glass-blur: blur(30px) saturate(190%);
  --glass-border: rgba(255, 255, 255, 0.95);
  --glass-shadow: 0 14px 44px rgba(120, 100, 70, 0.14), 0 2px 12px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.22);
  --progress-gradient: linear-gradient(90deg, #6FC593 0%, #BCE9CF 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: linear-gradient(135deg, #FFF8E7 0%, #FFFBF0 100%);
  color: var(--text-main);
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* ============ SIDEBAR ============ */
.sidebar {
  width: 240px;
  min-width: 240px;
  height: 100vh;
  background: var(--cream-side);
  border-right: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
  transition: margin-left 0.28s ease;
}

.sidebar-header {
  padding: 24px 20px 16px;
  text-align: center;
  border-bottom: 1px dashed var(--border-soft);
}

.sidebar-header .avatar {
  font-size: 64px;
  margin-bottom: 8px;
  display: flex;
  justify-content: center;
}

.sidebar-header .name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
}

.sidebar-header .subtitle {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}

.nav-section {
  padding: 10px 0;
}

.nav-section-title {
  padding: 8px 24px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-light);
  letter-spacing: 2px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 24px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-sub);
  transition: all 0.2s ease;
  border-left: 3px solid transparent;
}

.nav-item:hover {
  background: var(--cream-card-hover);
  color: var(--text-main);
}

.nav-item.active {
  background: var(--cream-card);
  color: var(--accent-caramel);
  font-weight: 600;
  border-left: 3px solid var(--accent-caramel);
}

.nav-item .icon {
  font-size: 18px;
  width: 24px;
  text-align: center;
}

.sidebar-footer {
  margin-top: auto;
  padding: 16px 20px;
  text-align: center;
  font-size: 11px;
  color: var(--text-light);
  border-top: 1px dashed var(--border-soft);
}

/* ============ MAIN CONTENT ============ */
.main {
  flex: 1;
  height: 100vh;
  overflow-y: auto;
  padding: 24px 32px;
}

/* 桌面端：可折叠侧边栏（点击页面内汉堡按钮切换） */
body.sidebar-collapsed .sidebar {
  margin-left: -240px;
  transition: margin-left 0.28s ease;
}
/* 桌面端内联汉堡按钮（位于各页面页头左侧） */
.nav-toggle-inline {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; flex-shrink: 0;
  border-radius: 10px; border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  color: var(--text-sub); font-size: 18px; line-height: 1; cursor: pointer;
  outline: none; -webkit-tap-highlight-color: transparent;
  transition: border-color 0.2s, color 0.2s;
}
.nav-toggle-inline:hover { border-color: var(--accent-caramel); color: var(--accent-caramel); }

/* 桌面端折叠把手：从导航栏右侧边缘延伸出的竖向小标签，始终可见 */
.nav-toggle-float {
  position: fixed;
  top: 18px;
  left: 240px;
  z-index: 50;
  display: none;
  align-items: center; justify-content: center;
  width: 18px; height: 56px; flex-shrink: 0;
  border-radius: 0 12px 12px 0;
  border: 1px solid var(--border-soft);
  border-left: none;
  background: var(--cream-side);
  box-shadow: 2px 2px 8px rgba(120, 100, 70, 0.08);
  cursor: pointer;
  outline: none; -webkit-tap-highlight-color: transparent;
  transition: left 0.28s ease, border-color 0.2s ease;
}
.nav-toggle-float::before {
  content: '';
  width: 3px; height: 22px;
  border-radius: 3px;
  background: var(--text-light);
  opacity: 0.6;
  transition: background 0.2s ease, opacity 0.2s ease;
}
.nav-toggle-float:hover { border-color: var(--accent-caramel); }
.nav-toggle-float:hover::before { background: var(--accent-caramel); opacity: 1; }
body.sidebar-collapsed .nav-toggle-float { left: 0; }
@media (min-width: 769px) {
  .nav-toggle-float { display: inline-flex; }
}

/* ============ DASHBOARD ============ */
.dashboard {
  max-width: 100%;
}

.dashboard-hero {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 28px 34px;
  box-shadow: var(--glass-shadow);
  margin-bottom: 24px;
  max-width: 100%;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
}

.dashboard-hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(255, 245, 220, 0.42), transparent 72%);
  border-radius: 50%;
}

.dashboard-hero::after {
  content: '';
  position: absolute;
  bottom: -30px; left: -30px;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(255, 250, 235, 0.34), transparent 72%);
  border-radius: 50%;
}

.clock {
  font-size: 44px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: 4px;
  position: relative;
  z-index: 1;
  font-variant-numeric: tabular-nums;
}

.date-display {
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 6px;
  position: relative;
  z-index: 1;
  letter-spacing: 1px;
}

.weather-box {
  margin-top: 12px;
  font-size: 14px;
  color: var(--text-main);
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 4px;
  background: transparent;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.weather-box:hover { opacity: 0.7; }
.weather-box .w-temp { font-weight: 700; color: var(--text-main); }
.weather-box .w-sep { color: var(--text-light); }
.weather-box .w-loc { color: var(--text-sub); font-size: 12px; }

.hero-left { text-align: left; position: relative; z-index: 1; flex: 0 0 auto; }
.hero-left .clock { font-size: 42px; letter-spacing: 2px; }
.hero-center {
  flex: 1 1 auto; min-width: 0;
  position: relative; z-index: 1;
  padding: 0 16px;
}
.hero-center .quote-label {
  font-size: 11px; color: var(--text-light); margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px; letter-spacing: 1px;
}
.hero-center .quote-cn {
  font-size: 16px; color: var(--text-main); font-weight: 600;
  line-height: 1.55; margin-bottom: 5px;
}
.hero-center .quote-en {
  font-size: 12px; color: var(--text-sub); font-style: italic; line-height: 1.45;
}
.hero-right {
  flex: 0 0 auto; text-align: center; position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.hero-streak { font-size: 13px; color: var(--text-sub); font-weight: 600; }

.dash-section { margin-bottom: 24px; }
.dash-section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 18px; font-weight: 700; color: var(--text-main);
  margin-bottom: 14px;
}
.dash-section-title .ds-desc {
  font-size: 12px; color: var(--text-sub); font-weight: 400; margin-left: 6px;
}

/* 大卡片托盘：承载多个小卡片，参考 LKY 工作台风格 */
.board-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: 26px;
  padding: 22px;
  box-shadow: var(--glass-shadow);
}

.board-grid {
  display: grid;
  gap: 14px;
}

.board-item {
  background: rgba(255, 255, 255, 0.48);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 18px 16px;
  box-shadow: var(--glass-shadow);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  overflow: hidden;
}
.board-item:hover {
  transform: translateY(-3px);
  box-shadow: var(--glass-shadow), 0 10px 28px rgba(120, 100, 70, 0.12);
}

/* 今日打卡：小卡片（名称在左 + 打卡圆点在右），5 个同一行 */
.module-board-grid { grid-template-columns: repeat(5, 1fr); gap: 10px; }
.module-item {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
  min-height: 52px;
  padding: 12px 14px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.module-item:hover {
  transform: translateY(-3px);
  box-shadow: var(--glass-shadow), 0 10px 26px rgba(120, 100, 70, 0.1);
}
.module-item .mi-title { font-size: 12px; font-weight: 600; color: var(--text-main); position: relative; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.module-item .mi-dot {
  width: 11px; height: 11px; min-width: 11px;
  border-radius: 50%;
  background: #CFC8BB;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.6);
  flex-shrink: 0;
  transition: background 0.2s ease;
}
.module-item .mi-dot.on { background: var(--accent-green); box-shadow: 0 0 0 3px rgba(149,201,156,0.25); }

/* 今日概览：小卡片（标题+内容区），四列同一行 */
.overview-board-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
.overview-item {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 96px;
  padding: 14px 12px;
}
.overview-item .bi-header {
  display: flex; align-items: center; gap: 7px;
}
.overview-item .bi-icon { font-size: 17px; line-height: 1; }
.overview-item .bi-title { font-size: 12px; font-weight: 600; color: var(--text-main); }
.overview-item .bi-body { flex: 1; }

/* 工作打卡圆点状态（概览首卡：上班/下班同行） */
.ov-checkin-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 2px; }
.ov-checkin-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-main); }
.ov-dot {
  width: 10px; height: 10px; min-width: 10px;
  border-radius: 50%;
  background: #CFC8BB;
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.6);
  flex-shrink: 0;
  transition: background 0.2s ease;
}
.ov-dot.on { background: var(--accent-green); box-shadow: 0 0 0 3px rgba(149,201,156,0.25); }
.ov-checkin-hint { font-size: 12px; color: var(--text-light); margin-top: 8px; }

/* 进度条 */
.progress-wrap {
  width: 100%; height: 10px;
  background: rgba(0, 0, 0, 0.05);
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0 8px;
}
.progress-bar-fill {
  height: 100%;
  background: var(--progress-gradient);
  border-radius: 999px;
  transition: width 0.5s ease;
}
.progress-text { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }

.quote-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 20px 26px;
  box-shadow: var(--glass-shadow);
  margin-bottom: 22px;
}

.quote-card .quote-label {
  font-size: 11px;
  color: var(--text-light);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 1px;
}

.quote-card .quote-cn {
  font-size: 14px;
  color: var(--text-main);
  font-weight: 600;
  line-height: 1.6;
}

.quote-card .quote-en {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 6px;
  font-style: italic;
  line-height: 1.5;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}

.stat-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 18px 16px;
  box-shadow: var(--glass-shadow);
  text-align: center;
  transition: transform 0.2s, box-shadow 0.2s;
}

.stat-card:hover {
  transform: translateY(-3px);
}

.stat-card .stat-icon {
  font-size: 32px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: transform 0.15s;
}
.stat-card .stat-icon:hover { transform: scale(1.15); }

.stat-card .stat-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent-caramel);
}

.stat-card .stat-label {
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 4px;
}

/* 桌面端：6 个统计卡片改为横向细长（宽而矮、图标与文字并排） */
@media (min-width: 1025px) {
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  .stat-card {
    display: flex; flex-direction: row; align-items: center;
    text-align: left; gap: 14px; padding: 14px 20px;
  }
  .stat-card .stat-icon { font-size: 26px; margin-bottom: 0; }
  .stat-card .stat-value { font-size: 24px; }
  .stat-card .stat-label { margin-top: 0; }
}

/* ============ 首页「当日概览」四大板块内容样式 ============ */
.today-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.today-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid var(--glass-border);
  font-size: 13px; color: var(--text-main); font-weight: 600;
}
.today-li { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 14px; color: var(--text-main); }
.today-task { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 14px; }
.today-task .dot {
  width: 18px; height: 18px; min-width: 18px; border-radius: 50%;
  border: 2px solid var(--accent-caramel); background: var(--accent-caramel);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 11px; flex-shrink: 0;
}
.today-task .dot.off { background: transparent; border-color: var(--border-soft); }
.today-task.done .txt { color: var(--text-light); text-decoration: line-through; }
.today-task .txt { color: var(--text-main); }
.today-empty { font-size: 13px; color: var(--text-light); line-height: 1.6; }

@media (max-width: 768px) {
  .dashboard-hero { flex-direction: column; text-align: center; gap: 18px; padding: 24px 20px; }
  .hero-left { text-align: center; }
  .hero-left .clock { font-size: 38px; }
  .hero-center { padding: 0; }
  .hero-center .quote-cn { font-size: 15px; }
  .board-card { padding: 16px; }
  .module-board-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .module-item { min-height: 50px; padding: 12px 13px; }
  .module-item .mi-title { font-size: 13px; }
  .overview-board-grid { grid-template-columns: 1fr 1fr; }
  .overview-item { min-height: 90px; padding: 12px 10px; }
}

@media (max-width: 480px) {
  .module-board-grid { grid-template-columns: repeat(2, 1fr); }
}

/* ============ PAGE HEADER ============ */
.page-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.page-header .ph-icon {
  display: none;
}

.page-header .ph-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-main);
}

.page-header .ph-desc {
  font-size: 13px;
  color: var(--text-light);
  margin-left: auto;
}

/* ============ CARD ============ */
.card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--glass-shadow);
  margin-bottom: 20px;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.journal-title-toggle {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.journal-title-toggle:hover { color: var(--accent-pink); }
.journal-title-toggle .toggle-hint {
  font-size: 13px;
  color: var(--text-sub);
  transition: transform 0.15s ease;
}

/* ============ FORMS ============ */
.input, .textarea, .select {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--text-main);
  background: #FFFDF5;
  transition: border-color 0.2s;
  font-family: inherit;
}

.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--accent-caramel);
}

.textarea {
  resize: vertical;
  min-height: 80px;
}

.btn {
  padding: 8px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.2s;
  font-family: inherit;
}

.btn-primary {
  background: var(--accent-caramel);
  color: #fff;
}

.btn-primary:hover {
  background: #C4925E;
}

.btn-pink {
  background: var(--accent-pink);
  color: #fff;
}

.btn-green {
  background: var(--accent-green);
  color: #fff;
}

.btn-blue {
  background: var(--accent-blue);
  color: #fff;
}

.btn-purple {
  background: var(--accent-purple);
  color: #fff;
}

.btn-outline {
  background: transparent;
  border: 1.5px solid var(--border-soft);
  color: var(--text-sub);
}

.btn-outline:hover {
  border-color: var(--accent-caramel);
  color: var(--accent-caramel);
}

.btn-sm {
  padding: 5px 12px;
  font-size: 12px;
}

.btn-danger {
  background: transparent;
  border: 1.5px solid #E0BFBF;
  color: #C68888;
}

.btn-danger:hover {
  background: #FFF0F0;
}

/* ============ TASK LIST ============ */
.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #FFFCF5;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  border: 1px solid var(--border-soft);
  transition: all 0.2s;
}

.task-item:hover {
  border-color: var(--accent-caramel);
}

.task-checkbox {
  width: 20px;
  height: 20px;
  min-width: 20px;
  border: 2px solid var(--accent-caramel);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.task-checkbox.done {
  background: var(--accent-green);
  border-color: var(--accent-green);
}

.task-checkbox.done::after {
  content: '✓';
  color: #fff;
  font-size: 12px;
  font-weight: bold;
}

.task-text {
  flex: 1;
  font-size: 14px;
  color: var(--text-main);
}

.task-text.done {
  text-decoration: line-through;
  color: var(--text-light);
}

.task-delete {
  opacity: 0.55;
  transition: opacity 0.2s;
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  color: #C68888;
  padding: 4px 6px;
}
.task-item:hover .task-delete,
.task-item:hover .task-edit {
  opacity: 1;
}
.task-edit {
  opacity: 0.55;
  transition: opacity 0.2s;
  background: none;
  border: none;
  font-size: 15px;
  cursor: pointer;
  color: var(--accent-caramel);
  padding: 4px 6px;
}

.derived-label {
  margin: 16px 0 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sub);
  letter-spacing: 1px;
  padding-top: 12px;
  border-top: 1px dashed var(--border-soft);
}

.roll-badge {
  font-size: 11px;
  color: var(--accent-orange);
  background: rgba(244, 164, 96, 0.14);
  border-radius: 999px;
  padding: 1px 7px;
  white-space: nowrap;
}

.link-badge {
  font-size: 13px;
  margin-left: 2px;
}

/* 历史任务 */
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  background: rgba(255, 255, 255, 0.5);
  border-radius: 14px;
  border: 1px solid var(--glass-border);
}
.history-check {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent-green);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.emoji-palette {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px;
  max-height: 168px;
  overflow-y: auto;
  padding: 4px;
  background: rgba(255, 255, 255, 0.4);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
}
.emoji-chip {
  font-size: 19px;
  line-height: 1;
  height: 34px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: rgba(255, 255, 255, 0.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  -webkit-tap-highlight-color: transparent;
}
.emoji-chip:hover { transform: scale(1.12); background: #fff; border-color: var(--accent-pink); }
.emoji-chip:active { transform: scale(0.94); }
.history-body { flex: 1; min-width: 0; }
.history-text {
  font-size: 14px;
  color: var(--text-main);
  word-break: break-word;
}
.history-meta {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 4px;
  flex-wrap: wrap;
}
.history-src {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 999px;
  background: rgba(232, 160, 191, 0.18);
  color: var(--accent-pink);
}
.history-src.src-todo { background: rgba(149, 201, 156, 0.2); color: var(--accent-green); }
.history-src.src-sched { background: rgba(206, 155, 221, 0.22); color: #8A4FA5; }
.history-cat { font-size: 11px; color: var(--text-sub); }
.history-date { font-size: 11px; color: var(--text-light); }

/* 月度折叠卡片（历史任务 / 睡眠记录共用） */
.month-card {
  background: var(--cream-card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: 0 2px 10px rgba(140, 150, 180, 0.08);
}
.month-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.month-card-header:hover { background: var(--cream-card-hover); }
.month-card-title { font-size: 15px; font-weight: 700; color: var(--text-main); }
.month-card-count { font-size: 12px; color: var(--text-sub); margin-left: 8px; }
.month-arrow {
  font-size: 13px;
  color: var(--text-light);
  transition: transform 0.2s ease;
}
.month-card.open .month-arrow { transform: rotate(90deg); }
.month-card-body { display: none; padding: 0 16px 14px; }
.month-card.open .month-card-body { display: block; }

/* 待办事项页：左右两列（待办 / 日程） */
.todo-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}
.todo-col { min-width: 0; }

/* 日程看板 */
.sched-list { display: flex; flex-direction: column; gap: 10px; }
.sched-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 12px;
  background: rgba(255, 255, 255, 0.5);
  border-radius: 14px;
  border: 1px solid var(--glass-border);
}
.sched-check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--accent-pink);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  cursor: pointer;
  background: transparent;
  transition: background 0.15s ease;
}
.sched-check.on { background: var(--accent-pink); }
.sched-body { flex: 1; min-width: 0; }
.sched-title { font-size: 14px; color: var(--text-main); font-weight: 600; }
.sched-title.done { text-decoration: line-through; color: var(--text-light); }
.sched-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 3px; }
.sched-date { font-size: 11px; color: var(--accent-blue); }
.sched-today { font-size: 11px; color: var(--accent-green); }
.sched-note { font-size: 12px; color: var(--text-sub); margin-top: 4px; line-height: 1.5; }

.task-time {
  font-size: 12px;
  color: var(--text-sub);
  font-variant-numeric: tabular-nums;
  min-width: 44px;
  text-align: right;
}

.task-item.todo-derived {
  background: #FBF4E6;
  border-style: dashed;
  border-color: var(--border-soft);
}

/* ============ PROGRESS BAR ============ */
.progress-bar {
  width: 100%;
  height: 8px;
  background: #F0E8D0;
  border-radius: 4px;
  overflow: hidden;
  margin: 10px 0;
}

.progress-fill {
  height: 100%;
  background: var(--progress-gradient);
  border-radius: 4px;
  transition: width 0.3s ease;
}

/* ============ EXERCISE MODULES ============ */
.exercise-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.exercise-tab {
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
  border: 2px solid var(--border-soft);
  background: var(--cream-card);
  color: var(--text-sub);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.exercise-tab.active {
  border-color: var(--accent-caramel);
  background: var(--accent-caramel);
  color: #fff;
}

.exercise-record {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: #FFFCF5;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  border: 1px solid var(--border-soft);
}

.exercise-record .er-type {
  font-size: 22px;
}

.exercise-record .er-info {
  flex: 1;
}

.exercise-record .er-duration {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}

.exercise-record .er-cal {
  font-size: 13px;
  color: var(--text-sub);
}

.exercise-record .er-calories {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent-orange);
}

/* ============ LEARNING MODULES ============ */
.learning-modules {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.learning-module {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--glass-shadow);
}

.learning-module .lm-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.learning-module .lm-title {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.learning-item {
  background: #FFFCF5;
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 8px;
  border: 1px solid var(--border-soft);
}

.learning-item .li-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 4px;
}

.learning-item .li-link {
  font-size: 12px;
  color: var(--accent-blue);
  word-break: break-all;
}

.learning-item .li-link a {
  color: var(--accent-blue);
  text-decoration: none;
}

.learning-item .li-link a:hover {
  text-decoration: underline;
}

.learning-item .li-notes {
  font-size: 13px;
  color: var(--text-sub);
  margin-top: 4px;
  line-height: 1.5;
}

/* ============ READING ============ */
/* ============ 书架 / 图书 ============ */
.mini-checkin { width: auto; padding: 9px 22px; font-size: 14px; display: table; margin: 0 auto; }

.bookshelf-scroll {
  max-height: 340px;
  overflow-y: auto;
  padding: 4px 4px 6px;
  border-radius: 16px;
  background: rgba(180, 150, 110, 0.10);
  box-shadow: inset 0 3px 10px rgba(120, 100, 70, 0.16), inset 0 -3px 10px rgba(120, 100, 70, 0.10);
}
.bookshelf-scroll::-webkit-scrollbar { width: 8px; }
.bookshelf-scroll::-webkit-scrollbar-thumb { background: rgba(150, 120, 85, 0.30); border-radius: 8px; }
.bookshelf {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 14px 16px;
  padding: 10px 4px 4px;
  position: relative;
}

.book {
  width: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.2s ease;
}
.book:hover { transform: translateY(-4px); }

.book-cover {
  width: 60px;
  height: 86px;
  border-radius: 5px 9px 9px 5px;
  background: linear-gradient(135deg, #F6DCEA, #E9C6DD);
  box-shadow:
    inset 3px 4px 9px rgba(110, 85, 60, 0.32),
    inset -3px -3px 8px rgba(110, 85, 60, 0.30),
    inset 0 0 12px rgba(0, 0, 0, 0.16);
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(120, 100, 70, 0.18);
}
.book-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.book-cover .bc-title {
  padding: 10px 8px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: #6B3F57;
  line-height: 1.35;
  word-break: break-word;
}
.book-cover .bc-spine {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 7px;
  background: linear-gradient(90deg, rgba(0,0,0,0.22), rgba(0,0,0,0.04));
  border-right: 1px solid rgba(255,255,255,0.3);
}
.book-title {
  margin-top: 9px;
  font-size: 12px;
  color: var(--text-main);
  text-align: center;
  max-width: 60px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.book-finished {
  position: absolute;
  top: -7px; right: -7px;
  width: 25px; height: 25px;
  border-radius: 50%;
  background: var(--accent-green);
  color: #fff;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 7px rgba(0, 0, 0, 0.22);
  border: 2px solid #fff;
  cursor: pointer;
  z-index: 2;
}
.bookshelf-add { width: 100%; margin-top: 14px; }

/* 阅读统计 + 环形图 */
.read-stat-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.read-finished { text-align: center; padding: 0 8px; }
.rf-num { font-size: 30px; font-weight: 700; color: var(--accent-purple); }
.rf-label { font-size: 12px; color: var(--text-sub); }
.ring-divider { width: 1px; align-self: stretch; background: var(--border-soft); margin: 4px 2px; }
.ring-wrap { text-align: center; }
.ring-svg { width: 86px; height: 86px; display: block; }
.ring-num { font-size: 22px; font-weight: 700; fill: var(--text-main); }
.ring-cap { font-size: 12px; color: var(--text-sub); margin-top: 1px; }

/* 图书封面输入预览 */
.cover-preview {
  width: 70px; height: 100px; border-radius: 6px; object-fit: cover;
  border: 1px solid var(--border-soft); margin-top: 8px; display: none;
}

/* ============ JOURNAL ============ */
.journal-area {
  width: 100%;
  min-height: 300px;
  padding: 16px;
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius);
  font-size: 15px;
  line-height: 1.8;
  color: var(--text-main);
  background: #FFFDF5;
  resize: vertical;
  font-family: inherit;
}

.journal-area:focus {
  outline: none;
  border-color: var(--accent-caramel);
}

.save-indicator {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 8px;
}

.journal-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.journal-images {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}
.journal-thumb {
  position: relative;
  width: 110px;
  height: 110px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border-soft);
  background: #FFFCF5;
}
.journal-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.journal-thumb .thumb-del {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 13px;
  line-height: 22px;
  text-align: center;
  cursor: pointer;
  padding: 0;
}
.journal-thumb .thumb-del:hover { background: rgba(0,0,0,0.75); }
.journal-hist-img {
  max-width: 160px;
  max-height: 160px;
  border-radius: var(--radius-sm);
  margin: 8px 8px 0 0;
  border: 1px solid var(--border-soft);
  object-fit: cover;
}

/* ============ LUNCH MENU ============ */
.lunch-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: #FFFCF5;
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  border: 1px solid var(--border-soft);
}

.lunch-item .li-name {
  flex: 1;
  font-size: 14px;
}

.lunch-item .li-emoji {
  font-size: 20px;
}

/* 午饭菜单：周一到周五分列 */
.lunch-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
.lunch-col {
  background: #FFFCF5;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  min-height: 180px;
}
.lunch-col.today {
  border-color: var(--accent-caramel);
  box-shadow: 0 0 0 2px rgba(212,165,109,.18);
  background: #FFF7E8;
}
.lunch-col-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 10px;
}
.lunch-col-day {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}
.lunch-col-date {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 2px;
}
.lunch-col.today .lunch-col-day {
  color: var(--accent-caramel);
}
.lunch-col-add {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}
.lunch-col-add .input {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  font-size: 12px;
}
.lunch-col-add .btn {
  padding: 6px 10px;
  font-size: 12px;
}
.lunch-col-list {
  flex: 1;
  overflow-y: auto;
}
.lunch-col-empty {
  font-size: 12px;
  color: var(--text-light);
  text-align: center;
  padding: 12px 0;
}
.lunch-col .lunch-item {
  padding: 7px 9px;
  margin-bottom: 5px;
}
.lunch-col .lunch-item .li-emoji {
  font-size: 16px;
}
.lunch-col .lunch-item .li-name {
  font-size: 13px;
}

/* ============ NAV CUSTOM ICON / AVATAR ============ */
.nav-item .icon .nav-custom-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}
.sidebar-header .avatar .avatar-img {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent-caramel);
  box-shadow: 0 2px 8px rgba(212,163,115,0.35);
}
.avatar-edit {
  width: 56px; height: 56px; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--accent-caramel);
}

/* ============ CALENDAR SCHEDULE (待办/任务 同步) ============ */
.cal-sched {
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: stretch;
}
.cal-pill {
  font-size: 9px;
  line-height: 1.3;
  background: #FFF3E0;
  color: var(--text-sub);
  border-radius: 6px;
  padding: 1px 4px;
  max-width: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  border: 1px solid var(--border-soft);
}
.cal-pill.todo { background: #EAF3FF; border-color: #BBD3F0; color: #4A6FA5; }
.cal-pill.task { background: #F0F7EE; border-color: #C6E0BC; color: #5A8A4E; }
.cal-pill.sched { background: #F3E8F7; border-color: #CE9BDD; color: #8A4FA5; }
.cal-pill.done { opacity: .6; }
.cal-pill .ov-dot { display: inline-block; vertical-align: middle; width: 7px; height: 7px; min-width: 7px; margin: -1px 3px 0 0; box-shadow: none; }
.cal-pill.more { background: transparent; border: none; color: var(--text-light); text-align: left; padding-left: 2px; }

/* ============ APPEARANCE MODAL ============ */
.appearance-section { margin-bottom: 18px; }
.appearance-title { font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
.theme-swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.theme-swatch {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  border: 3px solid transparent; transition: transform .12s;
}
.theme-swatch:hover { transform: scale(1.08); }
.theme-swatch.active { border-color: var(--text-main); }
.icon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.icon-cell {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px; border: 1px solid var(--border-soft); border-radius: 10px;
  background: var(--cream-card);
}
.icon-cell .ic-prev {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
}
.icon-cell .ic-prev svg { width: 24px; height: 24px; }
.icon-cell .ic-prev img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
.icon-cell .ic-name { font-size: 11px; color: var(--text-sub); }
.icon-cell .ic-actions { display: flex; gap: 4px; }
.icon-cell .ic-btn {
  font-size: 10px; padding: 2px 6px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border-soft); background: #fff; color: var(--text-sub);
}
.icon-cell .ic-btn:hover { border-color: var(--accent-caramel); color: var(--accent-caramel); }

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(93, 64, 55, 0.3);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(4px);
}

.modal-overlay.show {
  display: flex;
}

.modal {
  background: var(--cream-card);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 460px;
  max-width: 90%;
  box-shadow: var(--shadow-card);
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
}

.modal .form-group {
  margin-bottom: 14px;
}

.modal .form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 6px;
}
/* 全天开关 */
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; cursor: pointer; inset: 0; background: #d9d2c4; border-radius: 26px; transition: background .2s ease; }
.switch .slider::before { content: ''; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s ease; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + .slider { background: var(--accent-pink); }
.switch input:checked + .slider::before { transform: translateX(20px); }
/* 日程徽标 */
.sched-repeat-badge { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: #F3E8F7; color: #8A4FA5; white-space: nowrap; }
.sched-allday-badge { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: #FFF3DA; color: #B8860B; white-space: nowrap; }

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

/* ============ SCROLL PICKER（滚轮选择器） ============ */
.picker-trigger {
  border: 1px solid var(--border-soft);
  background: var(--glass-bg);
  border-radius: 12px;
  padding: 9px 12px;
  font-size: 14px;
  color: var(--text-main);
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  transition: background 0.18s ease;
}
.picker-trigger:hover { background: rgba(255, 255, 255, 0.55); }
.picker-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(60, 50, 40, 0.35);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; transition: opacity 0.25s ease;
}
.picker-overlay.show { opacity: 1; }
.picker-sheet {
  width: 100%; max-width: 460px;
  background: linear-gradient(180deg, #FFFDF6, #FCF4E2);
  border-radius: 22px 22px 0 0;
  padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 40px rgba(120, 100, 70, 0.25);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(.22, 1, .36, 1);
}
.picker-overlay.show .picker-sheet { transform: translateY(0); }
.picker-header { font-size: 15px; font-weight: 700; color: var(--text-main); text-align: center; margin-bottom: 12px; }
.picker-wheels {
  position: relative;
  display: flex; justify-content: center; gap: 6px;
  height: 220px;
}
.picker-selband {
  position: absolute; top: 50%; left: 8px; right: 8px;
  height: 44px; transform: translateY(-50%);
  background: rgba(201, 160, 220, 0.18);
  border: 1px solid rgba(201, 160, 220, 0.45);
  border-radius: 12px; pointer-events: none;
}
.picker-col {
  flex: 1; height: 220px;
  overflow-y: auto; scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
  mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
}
.picker-col::-webkit-scrollbar { display: none; }
.picker-items { padding: 88px 0; }
.picker-item {
  height: 44px; scroll-snap-align: center;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; color: var(--text-light);
  transition: color 0.15s ease, font-weight 0.15s ease;
}
.picker-item.sel { color: var(--text-main); font-weight: 700; }
.picker-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }

/* ============ WORK CHECKIN ============ */
.work-checkin-card {
  text-align: center;
  padding: 40px 30px;
}

.work-checkin-status {
  font-size: 16px;
  color: var(--text-sub);
  margin: 16px 0;
}

.work-checkin-time {
  font-size: 36px;
  font-weight: 200;
  color: var(--accent-caramel);
  margin: 10px 0;
}

.work-streak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  background: #FFF3D6;
  border-radius: 20px;
  font-size: 14px;
  color: var(--text-main);
  margin-top: 12px;
}

/* ===== 打卡卡片（上班/下班分离） ===== */
.punch-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 4px;
}
.punch-item {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: var(--glass-shadow);
}
.punch-label { font-size: 14px; font-weight: 600; color: var(--text-main); }
.punch-time { font-size: 22px; font-weight: 700; color: var(--accent-green); font-variant-numeric: tabular-nums; }
.punch-time .punch-empty { font-size: 13px; font-weight: 500; color: var(--text-light); }
.punch-hint { font-size: 12px; color: var(--text-sub); margin-top: 10px; line-height: 1.6; }

/* ===== 同步状态指示 ===== */
.sync-indicator {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; padding: 4px 10px; border-radius: 12px;
  background: #EEF7F0; color: var(--accent-green); margin-bottom: 10px;
}
.sync-indicator .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sync-indicator.busy { background: #FFF3D6; color: var(--accent-caramel); }
.sync-indicator.off { background: #F2F2F2; color: var(--text-light); }
.sync-indicator.err { background: #FFF0F0; color: var(--accent-red); }

/* ============ EMPTY STATE ============ */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
}

.empty-state .es-icon {
  font-size: 40px;
  margin-bottom: 10px;
  opacity: 0.5;
}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #E0D0B0;
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent-caramel);
}

/* ============ TOAST ============ */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text-main);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 2000;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(-10px);
}

/* ============ DOG ICONS ============ */
.dog-icon { display: block; }

.nav-item .icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.sidebar-header .avatar svg {
  filter: drop-shadow(0 2px 4px rgba(212,163,115,0.3));
}

/* ============ TODO (待办事项) ============ */
.todo-group { margin-bottom: 18px; }
.todo-group-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-caramel);
  margin-bottom: 8px;
  padding-left: 2px;
}
.todo-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  background: #FFFCF5;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  border: 1px solid var(--border-soft);
  transition: all 0.2s;
}
.todo-item:hover { border-color: var(--accent-caramel); }
.todo-item.done { opacity: 0.6; }
.todo-main { flex: 1; min-width: 0; }
.todo-text { font-size: 14px; color: var(--text-main); }
.todo-text.done { text-decoration: line-through; color: var(--text-light); }
.todo-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.todo-cat {
  font-size: 11px; color: var(--text-sub);
  background: #F4ECD8; border-radius: 8px; padding: 1px 8px;
}
.todo-done {
  width: 22px; height: 22px; min-width: 22px;
  border: 2px solid var(--accent-green);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: bold; color: #fff;
  transition: all 0.2s;
}
.todo-done.on { background: var(--accent-green); }
.todo-done:not(.on) { border-color: #CFE3CF; color: transparent; }

/* ============ CALENDAR ============ */
.calendar-wrap {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--glass-shadow);
  margin-bottom: 20px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.calendar-header .cal-month-label {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
}

.cal-nav-btn {
  width: 32px;
  height: 32px;
  border: 1.5px solid var(--border-soft);
  border-radius: 50%;
  background: var(--cream-card);
  cursor: pointer;
  font-size: 14px;
  color: var(--text-sub);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cal-nav-btn:hover {
  background: var(--accent-caramel);
  color: #fff;
  border-color: var(--accent-caramel);
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 12px;
}

.cal-weekday {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-light);
  padding: 6px 0;
  min-width: 0;
  overflow: hidden;
}

.cal-cell {
  aspect-ratio: 1;
  border: 1px solid var(--border-soft);
  border-radius: 5px;
  padding: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--cream-card);
  min-height: 56px;
  min-width: 0;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(120,90,40,0.06);
}

.cal-cell:hover {
  border-color: var(--accent-caramel);
  box-shadow: 0 2px 8px rgba(212,163,115,0.2);
  transform: translateY(-1px);
}

.cal-cell.cal-today {
  border: 2px solid var(--accent-caramel);
  background: #FFF3D6;
}

.cal-cell.cal-checked {
  background: #E8F5E9;
  border-color: var(--accent-green);
}

.cal-cell.cal-sick {
  background: #FFF0F0;
  border-color: #F0B0B0;
}

.cal-cell.cal-annual {
  background: #E3F2FD;
  border-color: var(--accent-blue);
}

.cal-cell.cal-comp {
  background: #F3E5F5;
  border-color: var(--accent-purple);
}

.cal-cell.cal-duty {
  background: #FFF1E0;
  border-color: var(--accent-caramel);
}

.cal-cell.cal-makeup {
  background: #E6F4EA;
  border-color: var(--accent-green);
}

.cal-cell.cal-makeup-auto {
  background: #EEF7F0;
  border-color: #9CCCB6;
}

.cal-makeup-label {
  color: #5A9E8C;
  font-weight: 600;
}

.cal-cell.cal-future {
  opacity: 0.4;
  cursor: default;
}

.cal-cell.cal-future:hover {
  border-color: var(--border-soft);
  box-shadow: none;
  transform: none;
}

.cal-cell.cal-empty {
  background: #FFFBF2;
}

.cal-cell.cal-rest {
  background: #FFF3C4;
  border-color: #F1D58A;
}

.cal-rest-label {
  color: #C99A1E;
  font-weight: 600;
}

.cal-date {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}

.cal-status {
  font-size: 10px;
  color: var(--text-sub);
  margin-top: 2px;
  text-align: center;
  line-height: 1.2;
}

.cal-hint {
  color: var(--accent-caramel);
  font-weight: 600;
}

/* ============ LEAVE BALANCE ============ */
.leave-balance {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.work-leave-tray { margin-bottom: 20px; }
.work-leave-tray .leave-balance { margin-bottom: 0; }
.work-leave-tray .leave-card { padding: 14px 12px; }

.leave-card {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-top: 3px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--glass-shadow);
  text-align: center;
}

.leave-card.lc-annual { border-top-color: var(--glass-border); }
.leave-card.lc-comp { border-top-color: var(--glass-border); }
.leave-card.lc-sick { border-top-color: var(--glass-border); }

.leave-card .lc-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
}

.leave-card .lc-label {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 2px;
}

.leave-card .lc-sub {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 4px;
}

/* ============ LEAVE OPTIONS ============ */
.leave-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.leave-btn {
  padding: 10px;
  border: 2px solid var(--border-soft);
  border-radius: var(--radius-sm);
  background: var(--cream-card);
  cursor: pointer;
  font-size: 14px;
  color: var(--text-sub);
  transition: all 0.2s;
  font-family: inherit;
}

.leave-btn:hover {
  border-color: var(--accent-caramel);
}

.leave-btn.active {
  border-color: var(--accent-caramel);
  background: #FFF3D6;
  color: var(--accent-caramel);
  font-weight: 600;
}

/* ============ CALENDAR LEGEND ============ */
.cal-legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-sub);
}

.cal-legend .legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.cal-legend .legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 4px;
  display: inline-block;
}

/* 抽屉切换按钮 / 遮罩：桌面端默认隐藏，仅手机端媒体查询内显示 */
.nav-toggle, .nav-scrim { display: none; outline: none; -webkit-tap-highlight-color: transparent; }
.nav-toggle:focus, .nav-toggle:active, .nav-scrim:focus, .nav-scrim:active { outline: none; }

/* ============ RESPONSIVE ============ */
/* ============ 手机端适配（安卓 / 鸿蒙 Pura X） ============ */
/* ============ 手机端：保持与电脑版一致的布局（左侧竖排侧边栏 + 右侧主内容） ============ */
@media (max-width: 768px) {
  body {
    flex-direction: row;
    height: 100vh;
    height: 100dvh;
  }

  /* 待办事项页：手机端两列改为上下堆叠 */
  .todo-columns { grid-template-columns: 1fr; gap: 14px; }

  /* 抽屉切换按钮（左上角，仅手机端显示） */
  .nav-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    top: 12px; left: 12px;
    z-index: 60;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.65);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 14px rgba(140,150,180,0.25);
    font-size: 18px; line-height: 1;
    color: #5A6B7B;
    cursor: pointer;
  }
  /* 手机端仍用左上角固定抽屉按钮，页面内联汉堡隐藏 */
  .nav-toggle-inline { display: none; }
  /* 手机端隐藏按钮同步为电脑端「侧边延伸把手」样式 */
  .nav-toggle { display: none; }
  .nav-toggle-float { display: inline-flex; top: 14px; left: 118px; }
  body.nav-hidden .nav-toggle-float { left: 0; }
  /* 侧边栏展开时的半透明遮罩，点击收起 */
  .nav-scrim {
    display: none;
    position: fixed; inset: 0;
    z-index: 44;
    background: rgba(40,50,70,0.28);
  }
  body:not(.nav-hidden) .nav-scrim { display: block; }

  /* 侧边栏：手机端改为可滑出的抽屉（默认收起，点按钮滑出） */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 118px;
    min-width: 118px;
    height: 100vh;
    height: 100dvh;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    border-right: 1px solid var(--border-soft);
    border-bottom: none;
    -webkit-overflow-scrolling: touch;
    z-index: 55;
    background: var(--cream-side);
    transform: translateX(0);
    transition: transform 0.28s ease;
    box-shadow: 4px 0 24px rgba(120,140,170,0.22);
  }
  body.nav-hidden .sidebar {
    transform: translateX(-100%);
    box-shadow: none;
  }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 4px; }

  .sidebar-header {
    padding: 12px 8px 10px;
    text-align: center;
    border-bottom: 1px dashed var(--border-soft);
    border-right: none;
  }
  .sidebar-header .avatar { font-size: 36px; margin-bottom: 4px; }
  .sidebar-header .avatar .avatar-img { width: 44px; height: 44px; }
  .sidebar-header .name { font-size: 13px; }
  .sidebar-header .subtitle { font-size: 9px; margin-top: 1px; }

  .nav-section { padding: 5px 0; }
  .nav-section-title { padding: 5px 10px; font-size: 9px; letter-spacing: 0.5px; }
  .nav-item { padding: 8px 10px; font-size: 11px; gap: 5px; }
  .nav-item .icon { font-size: 14px; width: 16px; }

  .sidebar-footer {
    padding: 10px 8px;
    font-size: 9px;
    border-top: 1px dashed var(--border-soft);
    border-left: none;
  }
  .sidebar-footer button {
    width: 100% !important;
    margin-top: 6px !important;
    font-size: 10px;
    padding: 5px 6px;
  }

  /* 主内容区 */
  .main {
    flex: 1;
    width: 100%;
    min-width: 0;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    padding: 56px 12px 12px;
  }
  .dashboard { padding: 0; }
  .dashboard-hero { padding: 20px 16px; margin-bottom: 14px; }
  .card { padding: 14px; }
  .page-header { flex-wrap: wrap; }
  .modal { max-width: 94%; padding: 18px; }
  /* 触屏无 hover：编辑/删除按钮常显 */
  .task-edit, .task-delete { opacity: 1; }

  /* 主内容变窄：多列网格降为单列，避免溢出 */
  .stats-grid { grid-template-columns: 1fr; gap: 12px; }
  .learning-modules { grid-template-columns: 1fr; gap: 12px; }
  .leave-balance { gap: 6px; }

  /* 午饭菜单 5 列：横向滑动 */
  .lunch-grid {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    padding-bottom: 6px;
  }
  .lunch-grid .lunch-col {
    flex: 0 0 138px;
    min-width: 138px;
  }

  /* 日历：完整 7 列显示，不再横向溢出；单元格精简内容避免压扁 */
  .calendar-wrap {
    overflow-x: visible;
    -webkit-overflow-scrolling: auto;
    padding: 12px;
  }
  .calendar-header { margin-bottom: 10px; flex-wrap: wrap; gap: 6px; }
  .calendar-header .cal-month-label { font-size: 15px; }
  .calendar-header .btn-sm { font-size: 11px; padding: 5px 8px; }
  .cal-nav-btn { width: 26px; height: 26px; font-size: 12px; }
  .calendar-grid { gap: 10px; min-width: 0; }
  .cal-weekday { padding: 4px 0; font-size: 10px; }
  .cal-cell {
    aspect-ratio: auto;
    min-height: 42px;
    padding: 2px;
    border-radius: 4px;
    justify-content: center;
    box-shadow: 0 1px 2px rgba(120,90,40,0.05);
  }
  .cal-date { font-size: 11px; }
  .cal-status {
    font-size: 9px;
    margin-top: 1px;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .cal-status br { display: none; }
  .cal-sched { display: none; } /* 手机日历单元格不显示日程标签，点击日期看详情 */
  .cal-legend { gap: 8px; margin-top: 10px; font-size: 10px; }
  .cal-legend .legend-dot { width: 9px; height: 9px; border-radius: 3px; }
}

<script>
// ====================================================================
// DATA LAYER
// ====================================================================
const Store = {
  todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  },

  getDaily(date) {
    date = date || this.todayKey();
    const raw = localStorage.getItem('lxk_daily_' + date);
    if (raw) return JSON.parse(raw);
    return {
      workCheckin: null,
      workCheckout: null,
      tasks: [],
      lunchItems: [],
      lunchNotes: '',
      learning: {},
      reading: [],
      readingCheckin: false,
      exercise: { cardio: [], strength: [], swimming: [] },
      journal: '',
      mainCheckin: false
    };
  },

  setDaily(date, data) {
    date = date || this.todayKey();
    localStorage.setItem('lxk_daily_' + date, JSON.stringify(data));
  },

  saveDaily(data) {
    this.setDaily(this.todayKey(), data);
  },

  getCumulative() {
    const raw = localStorage.getItem('lxk_cumulative');
    if (raw) return JSON.parse(raw);
    return {
      totalCheckins: 0,
      streak: 0,
      lastCheckinDate: null,
      totalTasksDone: 0,
      totalLearningItems: 0,
      totalReadingItems: 0,
      totalExerciseMinutes: 0,
      totalCalories: 0,
      exerciseByType: { cardio: 0, strength: 0, swimming: 0 }
    };
  },

  saveCumulative(data) {
    localStorage.setItem('lxk_cumulative', JSON.stringify(data));
  },

  getSettings() {
    const raw = localStorage.getItem('lxk_settings');
    if (raw) return JSON.parse(raw);
    return {
      learningModules: [
        { id: 'eco', name: '经济基础', icon: '💰' },
        { id: 'biz', name: '工商管理', icon: '📊' },
        { id: 'piano', name: '钢琴学习', icon: '🎹' }
      ]
    };
  },

  saveSettings(data) {
    localStorage.setItem('lxk_settings', JSON.stringify(data));
  },

  getAllDates() {
    const dates = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('lxk_daily_')) {
        dates.push(key.replace('lxk_daily_', ''));
      }
    }
    return dates.sort().reverse();
  },

  // ===== Attendance (calendar) =====
  getAttendance(monthKey) {
    const raw = localStorage.getItem('lxk_att_' + monthKey);
    if (raw) return JSON.parse(raw);
    return {};
  },

  setAttendance(monthKey, data) {
    localStorage.setItem('lxk_att_' + monthKey, JSON.stringify(data));
  },

  // ===== Leave settings =====
  getLeaveSettings() {
    const raw = localStorage.getItem('lxk_leave_settings');
    if (raw) return JSON.parse(raw);
    return { annualTotal: 10, compTotal: 5 };
  },

  saveLeaveSettings(data) {
    localStorage.setItem('lxk_leave_settings', JSON.stringify(data));
  },

  // ===== Stat card emoji customization =====
  getStatEmoji() {
    const raw = localStorage.getItem('lxk_stat_emoji');
    if (raw) return JSON.parse(raw);
    return {};
  },
  saveStatEmoji(map) {
    localStorage.setItem('lxk_stat_emoji', JSON.stringify(map));
  },

  // ===== Sleep tracking (cross-day) =====
  getSleep() {
    const raw = localStorage.getItem('lxk_sleep');
    if (raw) return JSON.parse(raw);
    return {};
  },
  saveSleep(data) {
    localStorage.setItem('lxk_sleep', JSON.stringify(data));
  },

  // ===== Books (书架) =====
  getBooks() {
    const raw = localStorage.getItem('lxk_books');
    if (raw === null) {
      // 首次使用：把旧的每日阅读记录迁移为书架图书（去重，默认未读完）
      const books = [];
      const seen = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('lxk_daily_')) {
          try {
            const obj = JSON.parse(localStorage.getItem(key));
            (obj.reading || []).forEach(r => {
              const t = (r.title || '').trim();
              if (t && !seen[t]) {
                seen[t] = 1;
                books.push({ id: uid(), title: t, cover: r.cover || '', finished: false, finishedDate: null, link: r.link || '', notes: r.notes || '' });
              }
            });
          } catch (e) {}
        }
      }
      localStorage.setItem('lxk_books', JSON.stringify(books));
      return books;
    }
    return JSON.parse(raw);
  },
  saveBooks(arr) {
    localStorage.setItem('lxk_books', JSON.stringify(arr));
  },

  // 年假有效期规则：1-2 月仍可使用上一年度结转年假；3 月 1 日起启用当年度年假，次年 2 月最后一天（含）失效
  annualBlockYear() {
    const now = new Date();
    return (now.getMonth() + 1) <= 2 ? now.getFullYear() - 1 : now.getFullYear();
  },
  annualExpiryDate() {
    const y = this.annualBlockYear() + 1;
    const d = new Date(y, 2, 0); // 3 月 0 日 = 当年 2 月最后一天（闰年 29）
    return y + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },
  annualWindow() {
    return { start: this.annualBlockYear() + '-01-01', end: this.annualExpiryDate() };
  },

  // Count used leave days across all months
  getLeaveUsed() {
    let annual = 0, comp = 0, sick = 0, checkins = 0;
    const aw = this.annualWindow();
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('lxk_att_')) {
        const ym = key.slice('lxk_att_'.length); // 'YYYY-MM'
        const monthData = JSON.parse(localStorage.getItem(key));
        for (const day in monthData) {
          const r = monthData[day];
          const fullDate = ym + '-' + day; // 'YYYY-MM-DD'
          if (r.type === 'annual') { if (fullDate >= aw.start && fullDate <= aw.end) annual++; }
          if (r.type === 'comp') comp++;
          if (r.type === 'sick') sick++;
          if (r.type === 'checkin') checkins++;
        }
      }
    }
    return { annual, comp, sick, checkins };
  },

  // ===== Todos (long-term, not daily-reset) =====
  getTodos() {
    const raw = localStorage.getItem('lxk_todos');
    return raw ? JSON.parse(raw) : [];
  },

  saveTodos(todos) {
    localStorage.setItem('lxk_todos', JSON.stringify(todos));
  },

  getTodoCategories() {
    const raw = localStorage.getItem('lxk_todo_categories');
    return raw ? JSON.parse(raw) : ['工作', '生活', '学习', '重要'];
  },

  saveTodoCategories(cats) {
    localStorage.setItem('lxk_todo_categories', JSON.stringify(cats));
  },

  // ===== 日程（按时间同步到日历与每日任务） =====
  getSchedule() {
    const raw = localStorage.getItem('lxk_schedule');
    return raw ? JSON.parse(raw) : [];
  },

  saveSchedule(arr) {
    localStorage.setItem('lxk_schedule', JSON.stringify(arr));
  },

  // ===== 历史任务（已完成任务自动归档） =====
  getHistory() {
    const raw = localStorage.getItem('lxk_history_tasks');
    return raw ? JSON.parse(raw) : [];
  },

  saveHistory(arr) {
    localStorage.setItem('lxk_history_tasks', JSON.stringify(arr));
  },

  archiveTask(entry) {
    const arr = this.getHistory();
    const idx = arr.findIndex(h => h.id === entry.id);
    if (idx >= 0) {
      arr[idx].doneDate = entry.doneDate;
      arr[idx].doneTime = entry.doneTime;
    } else {
      arr.push(entry);
    }
    this.saveHistory(arr);
  }
};

function nowHMS() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function getTheme() { return localStorage.getItem('lxk_theme') || 'caramel'; }

function applyTheme(key) {
  const t = THEMES[key] || THEMES.caramel;
  const root = document.documentElement;
  for (const k in t.vars) root.style.setProperty(k, t.vars[k]);
}

function setTheme(key) {
  localStorage.setItem('lxk_theme', key);
  applyTheme(key);
  document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('swatch-' + key);
  if (el) el.classList.add('active');
}

function applyNavIcons() {
  document.querySelectorAll('.nav-item').forEach(item => {
    const page = item.getAttribute('data-page');

// 安全写入：图片过大导致 localStorage 爆容量时给出明确提示

  try { localStorage.setItem(k, v); return true; }
  catch (e) { showToast('这张图太大，本地存不下了，请换一张更小的图片'); return false; }
}

function resetNavIcon(page) { localStorage.removeItem('lxk_icon_' + page); applyNavIcons(); }

// 等比压缩为小图（保留透明底 → PNG；过大再退回 JPEG 并迭代降质量）
// targetBytes: 图标默认 50KB，头像默认 80KB，保证多图同步不触 Gitee 1MB 上限
function shrinkImage(file, maxW, targetBytes) {
  maxW = maxW || 160;
  targetBytes = targetBytes || (maxW <= 160 ? 50000 : 80000);
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);

        // 先尝试 PNG（保留透明）
        let out = cv.toDataURL('image/png');
        if (out.length <= targetBytes) { resolve(out); return; }

        // 再尝试 JPEG 0.85 → 0.70 → 0.60 → 0.50
        const qualities = [0.85, 0.75, 0.65, 0.55, 0.5];
        for (const q of qualities) {
          out = cv.toDataURL('image/jpeg', q);
          if (out.length <= targetBytes) { resolve(out); return; }
        }
        // 仍超限：再降一档尺寸（头像 180，图标 120）后重试一次 JPEG 0.5
        if (maxW > 120) {
          const smaller = Math.max(120, Math.floor(maxW * 0.7));
          const cv2 = document.createElement('canvas');
          const ratio = smaller / w;
          cv2.width = smaller; cv2.height = Math.max(1, Math.round(h * ratio));
          cv2.getContext('2d').drawImage(img, 0, 0, cv2.width, cv2.height);
          out = cv2.toDataURL('image/jpeg', 0.5);
        }
        if (out.length <= targetBytes * 1.5) { resolve(out); return; }
        reject(new Error('图片压缩后仍超过 ' + Math.round(targetBytes / 1000) + 'KB，请换一张更小的图片'));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 通用图片选择（自动压缩，避免超出本地容量与云端同步体积上限）
function pickImage(cb, maxW) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    shrinkImage(f, maxW || 160).then(cb).catch((err) => {
      showToast(err && err.message ? err.message : '图片处理失败，请换一张更小的图片');
    });
  };
  inp.click();
}

function openAppearance() {
  const curTheme = getTheme();
  const swatches = Object.keys(THEMES).map(k =>
    `<div class="theme-swatch ${k===curTheme?'active':''}" id="swatch-${k}" title="${THEMES[k].name}" style="background:${THEMES[k].main};" onclick="setTheme('${k}')"></div>`
  ).join('');

  const iconCells = ICON_PAGES.map(([page, label]) => {
    const custom = localStorage.getItem('lxk_icon_' + page);
    const prev = custom ? `<img src="${custom}" alt="">` : (DOG_ICONS[page] || '');
    return `
      <div class="icon-cell">
        <div class="ic-prev">${prev}</div>
        <div class="ic-name">${label}</div>
        <div class="ic-actions">
          <span class="ic-btn" onclick="pickImage(d=>setNavIcon('${page}',d),160)">换图</span>
          ${custom ? `<span class="ic-btn" onclick="resetNavIcon('${page}')">复位</span>` : ''}
        </div>
      </div>`;
  }).join('');

  const avatarCustom = localStorage.getItem('lxk_avatar');
  const avatarPrev = avatarCustom
    ? `<img class="avatar-edit" src="${avatarCustom}" alt="">`
    : `<div class="avatar-edit" style="display:flex;align-items:center;justify-content:center;background:var(--cream-card-hover);font-size:22px;">🐶</div>`;

  showModal(`
    <div class="modal-title">🎨 外观设置</div>

    <div class="appearance-section">
      <div class="appearance-title">主题颜色</div>
      <div class="theme-swatches">${swatches}</div>
    </div>

    <div class="appearance-section">
      <div class="appearance-title">工作台头像</div>
      <div style="display:flex;align-items:center;gap:14px;">
        ${avatarPrev}
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary btn-sm" onclick="pickImage(d=>setAvatar(d),256)">上传图片</button>
          ${avatarCustom ? `<button class="btn btn-outline btn-sm" onclick="resetAvatar()">恢复默认</button>` : ''}
        </div>
      </div>
    </div>

    <div class="appearance-section">
      <div class="appearance-title">导航图标（可上传图片替换）</div>
      <div class="icon-grid">${iconCells}</div>

function getTodayQuote() {
  const d = new Date();
  const dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return QUOTES[dayOfYear % QUOTES.length];
}

// NAVIGATION
// ====================================================================
let currentPage = 'dashboard';

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (navEl) navEl.classList.add('active');
  renderPage(page);
  closeNav(); // 手机端：选完页面自动收起抽屉
}

/* 手机端：侧边栏抽屉开关 */
function toggleNav() {
  if (window.matchMedia('(max-width: 768px)').matches) {
    document.body.classList.toggle('nav-hidden');
  } else {
    document.body.classList.toggle('sidebar-collapsed');
  }
  updateNavIcon();
}
function closeNav() {
  document.body.classList.add('nav-hidden');
  updateNavIcon();
}
function updateNavIcon() {
  // 移动端抽屉按钮显示三条横线；桌面端浮动把手用 CSS 竖纹，不在此写入文字
  const ch = '☰';
  const b = document.getElementById('navToggle');
  if (b) b.textContent = ch;
}

function renderPage(page) {
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  const pageDiv = document.createElement('div');
  pageDiv.className = 'fade-in';
  main.appendChild(pageDiv);

  switch(page) {
    case 'dashboard': renderDashboard(pageDiv); break;
    case 'work-checkin': renderWorkCheckin(pageDiv); break;
    case 'daily-tasks': renderDailyTasks(pageDiv); break;
    case 'lunch-menu': renderLunchMenu(pageDiv); break;
    case 'todo': renderTodo(pageDiv); break;
    case 'daily-learning': renderDailyLearning(pageDiv); break;
    case 'reading': renderReading(pageDiv); break;
    case 'exercise': renderExercise(pageDiv); break;
    case 'sleep': renderSleep(pageDiv); break;
    case 'journal': renderJournal(pageDiv); break;
    case 'history': renderHistory(pageDiv); break;
  }
  updateNavIcon();
}

function renderDashboard(container) {
  const data = Store.getDaily();
  const cum = Store.getCumulative();
  const quote = getTodayQuote();
  const now = new Date();
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;

  // ===== 首页「当日概览」四大板块数据 =====
  const monthKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const todayDayKey = String(now.getDate()).padStart(2, '0');
  const att = Store.getAttendance(monthKey);
  const todayRec = att[todayDayKey] || null;

  // 1) 工作打卡（上班 / 下班同行的圆点状态）
  const typeLabel = { sick: '🤒 病假', annual: '🏖 年假', comp: '💤 调休', duty: '🔆 值班', makeup: '🛠 补班' };
  let checkinHtml;
  if (todayRec && todayRec.type === 'checkin') {
    checkinHtml = `<div class="ov-checkin-row">
        <span class="ov-checkin-item">上班 <span class="ov-dot ${todayRec.checkin ? 'on' : ''}" title="${escHtml(todayRec.checkin || '未打卡')}"></span></span>
        <span class="ov-checkin-item">下班 <span class="ov-dot ${todayRec.checkout ? 'on' : ''}" title="${escHtml(todayRec.checkout || '未打卡')}"></span></span>
      </div>`;
  } else if (todayRec && typeLabel[todayRec.type]) {
    checkinHtml = `<div class="today-pills"><span class="today-pill">${typeLabel[todayRec.type]}</span></div>`;
  } else {
    const rest = isRestDay(now.getFullYear(), now.getMonth(), now.getDate());
    checkinHtml = rest
      ? '<div class="today-empty">🌿 今天休息，无需打卡</div>'
      : `<div class="ov-checkin-row">
           <span class="ov-checkin-item">上班 <span class="ov-dot"></span></span>
           <span class="ov-checkin-item">下班 <span class="ov-dot"></span></span>
         </div><div class="ov-checkin-hint">今天还没打卡</div>`;
  }

  // 2) 当日任务完成情况（含待办事项按日期自动汇入）
  const tasks = data.tasks || [];
  const linkedTodos = Store.getTodos().filter(t => t.date === Store.todayKey());
  const allTasks = tasks.concat(linkedTodos.map(t => ({ text: t.text, done: t.done, fromTodo: true })));
  const doneCount = allTasks.filter(t => t.done).length;
  let taskHtml;
  if (allTasks.length === 0) {
    taskHtml = '<div class="today-empty">今天还没有任务，去「每日任务」添加吧</div>';
  } else {
    const pct = Math.round(doneCount / allTasks.length * 100);
    taskHtml = `<div class="progress-text">已完成 ${doneCount}/${allTasks.length} · ${pct}%</div>
      <div class="progress-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
  }

  // 3) 当日午饭菜单
  const lunchKey = getTodayLunchKey();
  let lunchHtml;
  if (!lunchKey) {
    lunchHtml = '<div class="today-empty">周末不记录午饭菜单～</div>';
  } else {
    const items = (getLunch().days[lunchKey]) || [];
    if (items.length === 0) {
      lunchHtml = '<div class="today-empty">今天还没记录午饭，去「午饭菜单」添加吧</div>';
    } else {
      const fe = ['🍚','🥗','🍗','🐟','🥩','🍜','🍲','🥟','🧆','🥘','🍛','🥪','🌮','🌯','🍔','🍟','🍕','🥙','🍱'];
      lunchHtml = items.map((it, i) => `<div class="today-li"><span>${fe[i % fe.length]}</span><span>${escHtml(it)}</span></div>`).join('');
    }
  }

  // 4) 昨日睡眠情况
  const y = new Date(now); y.setDate(y.getDate() - 1);
  const yKey = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  const yRec = Store.getSleep()[yKey];
  let sleepHtml;
  if (yRec && yRec.sleep && yRec.wake) {
    const hrs = ((yRec.wake - yRec.sleep) / 3600000).toFixed(1);
    sleepHtml = `<div class="today-pills">
        <span class="today-pill">😴 睡 ${fmtHM(yRec.sleep)}</span>
        <span class="today-pill">☀️ 起 ${fmtHM(yRec.wake)}</span>
      </div><div class="today-progress">共 ${hrs} 小时睡眠</div>`;
  } else if (yRec && yRec.sleep) {
    sleepHtml = `<div class="today-empty">昨天记录睡觉 ${fmtHM(yRec.sleep)}，但还没打起床卡</div>`;
  } else {
    sleepHtml = '<div class="today-empty">昨天没有睡眠记录</div>';
  }

  // ===== 今日打卡看板数据 =====
  const learningCount = Object.values(data.learning || {}).reduce((s, a) => s + (a ? a.length : 0), 0);
  const exerciseCount = (data.exercise?.cardio?.length || 0) + (data.exercise?.strength?.length || 0) + (data.exercise?.swimming?.length || 0);
  // 今日打卡：仅 5 个打卡模块，已打卡显示绿点，否则灰点
  const sleepTodayRec = Store.getSleep()[Store.todayKey()] || {};
  const sleepChecked = !!sleepTodayRec.sleep || (now.getHours() < 12 && yRec && yRec.sleep);
  const modules = [
    { id: 'work-checkin', name: '工作打卡', checked: !!todayRec },
    { id: 'daily-learning', name: '每日学习', checked: !!data.learningCheckin || learningCount > 0 },
    { id: 'reading', name: '每日阅读', checked: !!data.readingCheckin },
    { id: 'exercise', name: '运动打卡', checked: !!data.exerciseCheckin || exerciseCount > 0 },
    { id: 'sleep', name: '睡眠打卡', checked: sleepChecked }
  ];
  const moduleGridHtml = `
    <div class="dash-section">
      <div class="dash-section-title">今日打卡<span class="ds-desc">点击卡片直达对应模块</span></div>
      <div class="board-card">
        <div class="board-grid module-board-grid">
          ${modules.map(m => `
            <div class="board-item module-item" onclick="navigate('${m.id}')">
              <span class="mi-title">${escHtml(m.name)}</span>
              <span class="mi-dot ${m.checked ? 'on' : ''}" title="${m.checked ? '今日已打卡' : '今日未打卡'}"></span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;

  const todayOverviewHtml = `
    <div class="dash-section">
      <div class="dash-section-title">📌 今日概览</div>
      <div class="board-card">
        <div class="board-grid overview-board-grid">
          <div class="board-item overview-item">

/* ============ 今日天气（open-meteo，免费无需密钥，支持 CORS） ============ */
const WEATHER_CACHE_KEY = 'lxk_weather_cache';
const WEATHER_LOC_KEY   = 'lxk_weather_loc';
const WEATHER_DEFAULT   = { name: '北京', lat: 39.9042, lon: 116.4074 };

function wmoWeather(code) {
  const m = {
    0:['☀️','晴'],1:['🌤','晴间多云'],2:['⛅','多云'],3:['☁️','阴'],
    45:['🌫','雾'],48:['🌫','雾凇'],
    51:['🌦','毛毛雨'],53:['🌦','毛毛雨'],55:['🌦','毛毛雨'],
    56:['🌧','冻毛雨'],57:['🌧','冻毛雨'],
    61:['🌧','小雨'],63:['🌧','中雨'],65:['🌧','大雨'],
    66:['🌧','冻雨'],67:['🌧','冻雨'],
    71:['🌨','小雪'],73:['🌨','中雪'],75:['🌨','大雪'],77:['❄️','雪粒'],
    80:['🌦','阵雨'],81:['🌦','阵雨'],82:['🌧','强阵雨'],
    85:['🌨','阵雪'],86:['🌨','阵雪'],
    95:['⛈','雷阵雨'],96:['⛈','雷阵雨伴雹'],99:['⛈','强雷阵雨伴雹']
  };
  return (m[code] || ['🌡','未知']) ;
}

function weatherLoc() {
  try {
    const s = localStorage.getItem(WEATHER_LOC_KEY);
    if (s) return JSON.parse(s);
  } catch (e) {}
  return WEATHER_DEFAULT;
}

function renderWeather(cur, loc) {
  const el = document.getElementById('dash-weather');
  if (!el) return;
  const [emoji, text] = wmoWeather(cur.code);
  el.innerHTML = `<span style="font-size:18px;">${emoji}</span>` +
    `<span class="w-temp">${Math.round(cur.temp)}°C</span>` +
    `<span class="w-sep">·</span><span class="w-loc">${escHtml(loc.name)}</span>` +
    `<span class="w-sep">·</span>湿度${Math.round(cur.humidity)}%` +
    `<span class="w-sep">·</span>风${Math.round(cur.wind)}km/h`;
}

async function fetchWeather(loc) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}` +
    `&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  const c = j.current;
  return { temp: c.temperature_2m, humidity: c.relative_humidity_2m, wind: c.wind_speed_10m, code: c.weather_code };
}

// 自动实时刷新：force=true 时忽略缓存直接向接口拉取
async function refreshWeather(force) {
  const loc = weatherLoc();
  if (!force) {
    // 10 分钟内且同一地点直接用缓存
    try {
      const cache = JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY) || 'null');
      if (cache && cache.loc && Math.abs(cache.loc.lat - loc.lat) < 0.01 && Math.abs(cache.loc.lon - loc.lon) < 0.01
          && Date.now() - cache.ts < 10 * 60 * 1000) {
        const el = document.getElementById('dash-weather');
        if (el) renderWeather(cache.cur, cache.loc);
        return;
      }
    } catch (e) {}
  }
  try {
    const cur = await fetchWeather(loc);
    try { localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ loc, cur, ts: Date.now() })); } catch (e) {}
    const el = document.getElementById('dash-weather');
    if (el) renderWeather(cur, loc);
  } catch (e) {
    const el = document.getElementById('dash-weather');
    if (el) el.textContent = '🌤 天气获取失败（点击重试）';
  }
}

function loadWeather() { refreshWeather(false); }

// 每 10 分钟自动拉取最新天气；切回页面/标签页可见时也刷新；避免缓存过期显示旧值
let _weatherTimer = null;
function startWeatherAutoRefresh() {
  if (_weatherTimer) clearInterval(_weatherTimer);
  _weatherTimer = setInterval(() => refreshWeather(true), 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshWeather(false);
  });
  window.addEventListener('focus', () => refreshWeather(false));
}

async function setWeatherCity() {
  const name = window.prompt('输入城市名（如：北京 / 上海 / 深圳）：', weatherLoc().name);
  if (!name) return;
  const el = document.getElementById('dash-weather');
  if (el) el.textContent = '🌤 查询城市中…';
  try {
    const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=zh`);
    const gj = await g.json();
    if (!gj.results || !gj.results.length) { showToast('未找到该城市，请重试'); if (el) el.textContent = '🌤 天气获取失败（点击重试）'; return; }
    const r = gj.results[0];
    const loc = { name: r.name, lat: r.latitude, lon: r.longitude };
    localStorage.setItem(WEATHER_LOC_KEY, JSON.stringify(loc));
    localStorage.removeItem(WEATHER_CACHE_KEY);
    const cur = await fetchWeather(loc);
    renderWeather(cur, loc);
    try { localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ loc, cur, ts: Date.now() })); } catch (e) {}
  } catch (e) {
    showToast('天气查询失败，请检查网络');
    if (el) el.textContent = '🌤 天气获取失败（点击重试）';
  }
}
